const REL_WORDS = [
  '生死相依', '青梅竹马', '未婚妻', '未婚夫', '前女友', '前男友', '道侣', '情侣', '恋人', '夫妻', '妻子', '丈夫',
  '挚爱', '红颜', '知己', '暗恋', '仰慕', '心动', '喜欢', '好感', '师徒', '师父', '师尊', '徒弟', '弟子',
  '师兄', '师弟', '师姐', '师妹', '父子', '父女', '母子', '母女', '兄弟', '兄妹', '姐弟', '姐妹',
  '父亲', '母亲', '儿子', '女儿', '至亲', '家人', '挚友', '好友', '朋友', '同门', '同僚', '同伴',
  '战友', '搭档', '盟友', '同盟', '主仆', '主人', '下属', '仆从', '护卫', '恩人', '仇人', '仇敌',
  '宿敌', '死敌', '敌对', '对手', '劲敌', '情敌', '宿怨', '棋子', '利用', '监视', '庇护', '守护',
  '追杀', '雇佣', '妖契', '血契', '命契', '契约', '羁绊', '旧识', '相识', '前辈', '后辈', '上司',
  '同事', '同学', '好奇', '警惕', '戒备', '依赖', '亏欠',
];

// 把关系描述收敛为单个词语标签
const relWord = (desc) => {
  if (!desc) return '';
  const d = String(desc).replace(/\*\*/g, '').trim();
  // 0. 未相识特判
  if (/尚未认识|未接触|未曾谋面|互不认识|不认识|未相遇/.test(d)) return '陌生';
  // 1. 规范格式「对方 — 关系词 — 说明」：首段即单词
  const dashParts = d.split('—').map(s => s.trim()).filter(Boolean);
  if (dashParts.length >= 2 && dashParts[0].length <= 6 && !/[。，；→：:（(]/.test(dashParts[0])) return dashParts[0];
  // 2. 箭头演进链：取最终态（≤6 字才视为单词）
  if (d.includes('→')) {
    const last = d.split('→').pop().replace(/[（(].*?[）)]/g, '').replace(/[。，；,;.\s]/g, '');
    if (last && last.length <= 6) return last;
  }
  // 3. 词典匹配：取文中最后一次出现的词
  let hit = null;
  for (const w of REL_WORDS) {
    let i = -1;
    while ((i = d.indexOf(w, i + 1)) >= 0) { if (!hit || i >= hit.i) hit = { w, i }; }
  }
  if (hit) return hit.w;
  // 4. 兜底：首句截断
  const first = d.split(/[。，；,;]/)[0].replace(/[（(].*?[）)]/g, '').trim();
  return first.length <= 6 ? first : first.slice(0, 5) + '…';
};

// 解析「对方名：描述」「对方名 — 描述」行（先剥离 ** 与括号注释）
const parseRelLine = (line) => {
  const clean = String(line).replace(/\*\*/g, '').trim();
  const m = clean.match(/^([^:：—\-（(]{1,12})\s*[—\-:：]\s*(.+)$/);
  if (!m) return null;
  return { name: m[1].replace(/[（(].*$/, '').trim(), desc: m[2].trim() };
};

const buildGraph = (roles, currentState) => {
  const accent = Utils.theme.get('accent');
  const minorColor = Utils.theme.get('textMuted');
  // 角色显示名：优先取文内一级标题（兼容拼音文件名，如 lu_chen.md → 陆尘）
  const roleName = (r) => {
    const m = r.text && r.text.match(/^#\s*([^\n（(]+)/);
    return (m ? m[1] : r.name).trim();
  };
  const nodes = roles.map((r, i) => {
    const heading = r.text && r.text.match(/^#\s*([^\n]+)/);
    const func = MDParser.extractSection(r.text, 'Story [Ff]unction|故事功能|角色[定定]?[位义]|功能').slice(0, 6).join('；');
    return {
      i, name: roleName(r), tier: r.tier,
      // 主角标记：标题注记（主角）；功能描述以「男主/主角」等开头为强标记
      prot: !!(heading && /主角/.test(heading[1])),
      protStrong: /^(男主|主角|主人公|主视角)/.test(func) || /protagonist/i.test(func),
      protWeak: /男主|女主|主角|主人公|主视角/i.test(func),
      color: /次要|minor/.test(r.tier) ? minorColor : accent,
      func,
      desire: MDParser.extractField(r.text, ['欲望', 'desire']) || MDParser.extractSection(r.text, '[Dd]esire|欲望').slice(0, 6).join('；'),
      fear: MDParser.extractField(r.text, ['恐惧', 'fear']) || MDParser.extractSection(r.text, '[Ff]ear|恐惧').slice(0, 6).join('；'),
      state: MDParser.extractField(r.text, ['当前状态', 'current state']) || MDParser.extractSection(r.text, '[Cc]urrent [Ss]tate|当前状态').slice(0, 6).join('；'),
      arc: MDParser.extractField(r.text, ['弧线', '成长', 'arc']) || MDParser.extractSection(r.text, '[Aa]rc|弧线|成长').slice(0, 6).join('；'),
      secrets: MDParser.extractSection(r.text, '[Ss]ecrets|秘密').slice(0, 6).join('；'),
    };
  });
  const nameIdx = new Map(nodes.map(nd => [nd.name.toLowerCase(), nd.i]));
  // 规范化查找：剥离 ** 与括号注释后精确匹配
  const findNode = (name) =>
    nameIdx.get(String(name).replace(/\*\*/g, '').replace(/[（(].*$/, '').trim().toLowerCase());

  const edges = [];
  const edgeSeen = new Set(); // 无向去重
  const addEdge = (si, ti, label, desc) => {
    if (si === undefined || ti === undefined || si === ti) return;
    const k = Math.min(si, ti) + '|' + Math.max(si, ti);
    if (edgeSeen.has(k)) return;
    edgeSeen.add(k);
    edges.push({ s: si, t: ti, label, desc: desc || label });
  };

  // 来源 1：角色卡的「人物关系 / Relationships / 关系网」段落
  roles.forEach((r, si) => {
    const lines = MDParser.extractSection(r.text, '[Rr]elationships?|关系[网战]?');
    for (const l of lines) {
      const p = parseRelLine(l);
      if (!p) continue;
      addEdge(si, findNode(p.name), relWord(p.desc), p.desc);
    }
  });

  // 来源 2：current_state.md 的「人物关系 Relationships」段落
  // 支持「A ↔ B：描述」行与主角中心表格（| 角色 | 与主角关系 | … |）
  if (currentState) {
    const lines = MDParser.extractSection(currentState, '[Rr]elationships?|关系[网战]?');
    // 主角定位（强 → 弱 → 角色卡连线最多 → 第一个主要角色）
    const isMinor = n => /次要|minor/.test(n.tier);
    let pi = nodes.findIndex(n => !isMinor(n) && (n.prot || n.protStrong));
    if (pi < 0) pi = nodes.findIndex(n => n.prot || n.protStrong);
    if (pi < 0) pi = nodes.findIndex(n => !isMinor(n) && n.protWeak);
    if (pi < 0 && edges.length) {
      const deg = nodes.map(() => 0);
      for (const e of edges) { deg[e.s]++; deg[e.t]++; }
      let bestDeg = 0;
      nodes.forEach((n, i) => { if (!isMinor(n) && deg[i] > bestDeg) { bestDeg = deg[i]; pi = i; } });
    }
    if (pi < 0) pi = nodes.findIndex(n => !isMinor(n));
    for (const l of lines) {
      if (/^\|/.test(l)) {
        // 表格行：col1 = 对方，col2 = 关系描述
        const cells = l.replace(/^\||\|$/g, '').split('|').map(s => s.trim());
        if (cells.length < 2) continue;
        if (/^[-—:\s]+$/.test(cells.join(''))) continue;      // 分隔行
        if (/角色|关系方|对象|姓名/.test(cells[0])) continue;   // 表头
        if (pi >= 0) addEdge(pi, findNode(cells[0]), relWord(cells[1]), cells[1]);
        continue;
      }
      // 「A ↔ B：描述」双方具名行
      const both = l.replace(/\*\*/g, '').match(/^([^:：—\-（(]{1,12})\s*↔\s*([^:：—\-（(]{1,12})\s*[：:]\s*(.+)$/);
      if (both) {
        addEdge(findNode(both[1]), findNode(both[2]), relWord(both[3]), both[3].trim());
        continue;
      }
      // 普通「对方：描述」行：挂到主角
      const p = parseRelLine(l);
      if (p && pi >= 0) addEdge(pi, findNode(p.name), relWord(p.desc), p.desc);
    }
  }
  return { nodes, edges };
};

/* ---------- GraphEngine 力导向关系图 ---------- */
const GraphEngine = (() => {
  let canvas, ctx, W = 0, H = 0, dpr = 1;
  let nodes = [], edges = [];
  let adjList = []; // 邻接表：nodes[i] 的邻居集合，避免每次全量扫描 edges
  let selected = -1, dragging = -1, hovered = -1;
  let raf = null;
  let physicsRunning = false;
  let settledCount = 0;
  let frameCount = 0; // 模拟帧计数，防止大角色图无限运行
  let resizeHandler = null; // 保存 resize handler 引用，供 destroy 移除
  // 视口变换：screen = world * scale + offset（节点坐标全部在世界坐标系中）
  let scale = 1, ox = 0, oy = 0;
  let panning = false, panStart = null;
  const MIN_SCALE = 0.25, MAX_SCALE = 3;
  const SETTLE_THRESHOLD = 0.5;
  const SETTLE_FRAMES = 10;
  const MAX_PHYSICS_FRAMES = 600; // 最多模拟 600 帧（约 10 秒），超时即停止
  const LARGE_GRAPH_THRESHOLD = 80; // 节点数超过此值视为大型关系图，降低迭代频率
  const WORLD_BOUND = 2400; // 世界坐标软边界，防止节点飞散

  const isMinorNode = n => /次要|minor/.test(n.tier);

  const toWorld = (mx, my) => ({ x: (mx - ox) / scale, y: (my - oy) / scale });

  const init = (cvs, gdata) => {
    // 重新初始化前先 destroy，避免监听器泄漏
    destroy();

    canvas = cvs;
    ctx = canvas.getContext('2d');
    selected = -1;
    dragging = -1;
    hovered = -1;
    panning = false;
    panStart = null;
    scale = 1; ox = 0; oy = 0;
    physicsRunning = false;
    settledCount = 0;

    const resize = () => {
      const r = canvas.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      canvas.width = r.width * dpr;
      canvas.height = r.height * dpr;
      W = r.width;
      H = r.height;
      // 节点在世界坐标系中，resize 不影响其位置，只需重绘
      draw();
    };
    resize();
    resizeHandler = resize;
    window.addEventListener('resize', resize);

    // 初始布局：主要角色在内圈、次要角色在外圈，均匀分布，避免开局乱成一团
    const majorCount = gdata.nodes.filter(n => !isMinorNode(n)).length;
    const minorCount = gdata.nodes.length - majorCount;
    let mi = 0, ni = 0;
    nodes = gdata.nodes.map(n => {
      const minor = isMinorNode(n);
      const idx = minor ? ni++ : mi++;
      const total = minor ? minorCount : majorCount;
      const R = minor ? Math.max(230, total * 24) : Math.max(120, total * 42);
      const a = (idx / Math.max(1, total)) * Math.PI * 2 - Math.PI / 2 + (minor ? 0.25 : 0);
      return {
        ...n,
        x: Math.cos(a) * R + (Math.random() - 0.5) * 30,
        y: Math.sin(a) * R + (Math.random() - 0.5) * 30,
        vx: 0, vy: 0, deg: 0, r: minor ? 14 : 18,
      };
    });
    edges = gdata.edges;
    // 预计算度数、半径与邻接表
    adjList = nodes.map(() => new Set());
    for (const e of edges) {
      nodes[e.s].deg++; nodes[e.t].deg++;
      adjList[e.s].add(e.t); adjList[e.t].add(e.s);
    }
    for (const n of nodes) n.r = (isMinorNode(n) ? 14 : 18) + Math.min(14, n.deg * 2);

    // 事件绑定
    canvas.onpointerdown = (e) => {
      const h = hitTest(e);
      if (h >= 0) {
        dragging = h;
        selectNode(h);
        // 拖拽时恢复物理模拟
        if (!physicsRunning) start();
      } else {
        // 空白处：开始平移
        panning = true;
        const r = canvas.getBoundingClientRect();
        panStart = { x: e.clientX - r.left, y: e.clientY - r.top, ox, oy };
        canvas.style.cursor = 'grabbing';
      }
      // 捕获指针，确保拖拽/平移期间指针移出 canvas 仍能接收事件
      try { canvas.setPointerCapture(e.pointerId); } catch {}
    };
    canvas.onpointermove = (e) => {
      const r = canvas.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      if (dragging >= 0) {
        const w = toWorld(mx, my);
        nodes[dragging].x = w.x;
        nodes[dragging].y = w.y;
        nodes[dragging].vx = 0;
        nodes[dragging].vy = 0;
        return;
      }
      if (panning && panStart) {
        ox = panStart.ox + (mx - panStart.x);
        oy = panStart.oy + (my - panStart.y);
        draw();
        return;
      }
      // 悬停高亮邻居
      const h = hitTest(e);
      canvas.style.cursor = h >= 0 ? 'pointer' : 'grab';
      if (h !== hovered) { hovered = h; draw(); }
    };
    const endPointer = (e) => {
      if (dragging >= 0 || panning) {
        try { canvas.releasePointerCapture(e.pointerId); } catch {}
      }
      dragging = -1;
      if (panning) { panning = false; panStart = null; canvas.style.cursor = 'grab'; }
    };
    canvas.onpointerup = endPointer;
    // 指针取消（如触屏来电）时安全结束拖拽
    canvas.onpointercancel = endPointer;
    // 双击空白处：适应画布
    canvas.ondblclick = (e) => { if (hitTest(e) < 0) zoomFit(); };
    // 滚轮：以光标为中心缩放
    canvas.onwheel = (e) => {
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      zoomBy(Math.exp(-e.deltaY * 0.0012), e.clientX - r.left, e.clientY - r.top);
    };

    zoomFit();
    start();
  };

  /* ---------- 视口控制 ---------- */
  const contentBBox = () => {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const n of nodes) {
      minX = Math.min(minX, n.x - n.r - 14);
      minY = Math.min(minY, n.y - n.r - 14);
      maxX = Math.max(maxX, n.x + n.r + 14);
      maxY = Math.max(maxY, n.y + n.r + 28); // 下方名称
    }
    return { minX, minY, maxX, maxY };
  };

  // 以适应方式把全部节点收入视野
  const zoomFit = () => {
    if (!canvas || !nodes.length || !W || !H) return;
    const b = contentBBox();
    const bw = Math.max(1, b.maxX - b.minX), bh = Math.max(1, b.maxY - b.minY);
    scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, Math.min(W / bw, H / bh) * 0.92));
    ox = W / 2 - (b.minX + b.maxX) / 2 * scale;
    oy = H / 2 - (b.minY + b.maxY) / 2 * scale;
    draw();
  };

  // 恢复 100% 缩放（内容居中）
  const zoomReset = () => {
    if (!canvas || !nodes.length || !W || !H) return;
    const b = contentBBox();
    scale = 1;
    ox = W / 2 - (b.minX + b.maxX) / 2;
    oy = H / 2 - (b.minY + b.maxY) / 2;
    draw();
  };

  // 以画布上某点为中心缩放（默认画布中心），该点对应的世界坐标保持不动
  const zoomBy = (f, cx, cy) => {
    if (!canvas) return;
    if (cx === undefined) cx = W / 2;
    if (cy === undefined) cy = H / 2;
    const ns = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * f));
    if (ns === scale) return;
    const wx = (cx - ox) / scale, wy = (cy - oy) / scale;
    scale = ns;
    ox = cx - wx * scale;
    oy = cy - wy * scale;
    draw();
  };

  const start = () => {
    if (physicsRunning) return;
    // 无节点时不启动无意义的动画循环
    if (!nodes.length) { draw(); return; }
    physicsRunning = true;
    settledCount = 0;
    frameCount = 0;
    loop();
  };

  const pause = () => {
    // GraphEngine 未初始化时安全返回
    if (!ctx || !canvas) return;
    physicsRunning = false;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    // 暂停时绘制一帧静态图
    draw();
  };

  const resume = () => {
    // GraphEngine 未初始化时安全返回
    if (!ctx || !canvas) return;
    if (!physicsRunning) {
      physicsRunning = true;
      // 重置模拟计数，确保重新进入标签时可合理绘制（即使已达 MAX_PHYSICS_FRAMES）
      settledCount = 0;
      frameCount = 0;
      loop();
    }
  };

  const destroy = () => {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    physicsRunning = false;
    // 移除 window resize 监听器（修复监听器泄漏）
    if (resizeHandler) { window.removeEventListener('resize', resizeHandler); resizeHandler = null; }
    if (canvas) {
      canvas.onpointerdown = null;
      canvas.onpointermove = null;
      canvas.onpointerup = null;
      canvas.onpointercancel = null;
      canvas.ondblclick = null;
      canvas.onwheel = null;
    }
    canvas = null;
    ctx = null;
    nodes = [];
    edges = [];
    adjList = [];
    panning = false;
    panStart = null;
  };

  const loop = () => {
    if (!physicsRunning) return;

    // 大型关系图性能优化：节点过多时降低迭代频率（隔帧跳过斥力计算）
    const isLargeGraph = nodes.length > LARGE_GRAPH_THRESHOLD;
    if (isLargeGraph && frameCount % 2 === 0) {
      // 仅更新位置，跳过斥力计算
      for (let i = 0; i < nodes.length; i++) {
        const n = nodes[i];
        if (i !== dragging) { n.x += n.vx; n.y += n.vy; }
      }
      draw();
      frameCount++;
      raf = requestAnimationFrame(loop);
      return;
    }

    // 物理模拟
    for (const n of nodes) { n.vx *= 0.85; n.vy *= 0.85; }

    // 弹簧力
    for (const e of edges) {
      const a = nodes[e.s], b = nodes[e.t];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const f = (d - 170) * 0.008;
      const ux = dx / d, uy = dy / d;
      a.vx += ux * f; a.vy += uy * f;
      b.vx -= ux * f; b.vy -= uy * f;
    }

    // 斥力
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        const f = -1400 / (d * d);
        const ux = dx / d, uy = dy / d;
        a.vx += ux * f; a.vy += uy * f;
        b.vx -= ux * f; b.vy -= uy * f;
      }
    }

    // 中心引力（世界坐标原点）
    for (const n of nodes) {
      n.vx += (0 - n.x) * 0.0012;
      n.vy += (0 - n.y) * 0.0012;
    }

    // 更新位置（世界坐标软边界，防止节点飞散到不可见区域）
    let totalSpeed = 0;
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      if (i !== dragging) {
        n.x += n.vx;
        n.y += n.vy;
        n.x = Math.max(-WORLD_BOUND, Math.min(WORLD_BOUND, n.x));
        n.y = Math.max(-WORLD_BOUND, Math.min(WORLD_BOUND, n.y));
      }
      totalSpeed += Math.abs(n.vx) + Math.abs(n.vy);
    }

    // 收敛检测
    if (totalSpeed < SETTLE_THRESHOLD) {
      settledCount++;
      if (settledCount >= SETTLE_FRAMES) {
        physicsRunning = false;
        draw();
        return;
      }
    } else {
      settledCount = 0;
    }

    // 帧数上限：大角色图在未收敛时及时停止，避免长时间占用主线程
    frameCount++;
    if (frameCount >= MAX_PHYSICS_FRAMES) {
      physicsRunning = false;
      draw();
      return;
    }

    draw();
    raf = requestAnimationFrame(loop);
  };

  // 圆角矩形路径（兼容无 ctx.roundRect 的环境）
  const rr = (x, y, w, h, r) => {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };

  const draw = () => {
    // ctx 或 canvas 为空时安全返回
    if (!ctx || !canvas || !W || !H) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const sans = Utils.theme.get('sans');
    if (!nodes.length) {
      ctx.fillStyle = Utils.theme.get('textMuted');
      ctx.font = '14px ' + sans;
      ctx.textAlign = 'center';
      ctx.fillText('暂无角色数据', W / 2, H / 2);
      return;
    }

    // 应用视口变换：之后全部在世界坐标系中绘制
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);

    const accent = Utils.theme.get('accent');
    const labelColor = Utils.theme.get('textMuted');
    const bgElevated = Utils.theme.get('bgElevated') || '#ffffff';
    const minorColor = Utils.theme.get('textMuted');
    const textColor = Utils.theme.get('text');
    const borderColor = Utils.theme.get('border');

    // 焦点：优先选中节点，其次悬停节点
    const focus = selected >= 0 ? selected : hovered;
    const isConnected = (e, i) => e.s === i || e.t === i;

    // 连线（二次曲线，按边确定性弯曲，避免平行边重叠）
    const placedLabels = []; // 本帧已放置的边标签矩形，用于碰撞检测
    for (let ei = 0; ei < edges.length; ei++) {
      const e = edges[ei];
      const a = nodes[e.s], b = nodes[e.t];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      // 确定性弯向：同一边每次绘制弯曲方向一致
      const bend = ((e.s * 31 + e.t * 17) % 2 === 0 ? 1 : -1) * Math.min(26, d * 0.12);
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const cxp = mx - (dy / d) * bend, cyp = my + (dx / d) * bend;

      const highlighted = focus >= 0 && isConnected(e, focus);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.quadraticCurveTo(cxp, cyp, b.x, b.y);
      if (highlighted) {
        ctx.strokeStyle = accent;
        ctx.globalAlpha = 0.9;
        ctx.lineWidth = 2.2;
      } else {
        ctx.strokeStyle = labelColor;
        ctx.globalAlpha = focus >= 0 ? 0.07 : 0.45;
        ctx.lineWidth = 1.4;
      }
      ctx.stroke();
      ctx.globalAlpha = 1;

      // 边标签：缩放过小时隐藏（防杂乱）；有焦点时只显示与焦点相连的
      const showLabel = e.label && (focus >= 0 ? isConnected(e, focus) : scale >= 0.85);
      if (showLabel) {
        // 二次曲线 t=0.5 处的中点
        const lx = 0.25 * a.x + 0.5 * cxp + 0.25 * b.x;
        const ly = 0.25 * a.y + 0.5 * cyp + 0.25 * b.y;
        const MAX_LABEL_LEN = 8;
        const isLong = e.label.length > MAX_LABEL_LEN;
        const txt = isLong ? e.label.slice(0, MAX_LABEL_LEN) + '…' : e.label;
        ctx.font = '11px ' + sans;
        const tw = ctx.measureText(txt).width;
        const rect = { x: lx - tw / 2 - 5, y: ly - 8, w: tw + 10, h: 16 };
        // 碰撞检测：与已放置的标签重叠则跳过，避免文字互相覆盖
        const collides = placedLabels.some(p =>
          rect.x < p.x + p.w && rect.x + rect.w > p.x && rect.y < p.y + p.h && rect.y + rect.h > p.y);
        if (collides) continue;
        placedLabels.push(rect);
        // 药丸底色 + 细边框，保证标签在任何连线上都清晰可读
        rr(rect.x, rect.y, rect.w, rect.h, 8);
        ctx.fillStyle = highlighted ? accent : bgElevated;
        ctx.globalAlpha = highlighted ? 0.95 : 0.9;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = highlighted ? accent : borderColor;
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = highlighted ? '#fff' : labelColor;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(txt, lx, ly + 0.5);
        // 长标签通过 title 属性提供完整提示
        if (isLong && canvas) canvas.title = e.label;
      }
    }

    // 节点（不只依赖颜色区分角色层级：主要角色用圆形+实心，次要角色用方形+虚边）
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      const r = n.r;
      const isFocus = focus === i;
      const isNeighbor = focus >= 0 && adjList[focus] && adjList[focus].has(i);
      const isDimmed = focus >= 0 && !isFocus && !isNeighbor;
      const isMinor = isMinorNode(n);

      ctx.globalAlpha = isDimmed ? 0.22 : 1;
      ctx.fillStyle = isMinor ? minorColor : accent;

      if (isMinor) {
        // 次要角色：方形 + 虚线边
        ctx.setLineDash([4, 3]);
        ctx.strokeStyle = minorColor;
        ctx.lineWidth = 1.5;
        ctx.fillRect(n.x - r, n.y - r, r * 2, r * 2);
        ctx.strokeRect(n.x - r, n.y - r, r * 2, r * 2);
        ctx.setLineDash([]);
      } else {
        // 主要角色：圆形 + 实心
        ctx.beginPath();
        ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // 选中 / 悬停描边
      if (i === selected) {
        ctx.lineWidth = 3;
        ctx.strokeStyle = accent;
        ctx.beginPath();
        ctx.arc(n.x, n.y, r + 2, 0, Math.PI * 2);
        ctx.stroke();
      } else if (i === hovered && i !== selected) {
        ctx.lineWidth = 2;
        ctx.strokeStyle = accent;
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.arc(n.x, n.y, r + 2, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // 节点内文字：节点过小时省略，避免糊成一团
      if (r * scale >= 9) {
        ctx.fillStyle = '#fff';
        ctx.font = Math.round(r * 0.62) + 'px ' + sans;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(n.name.slice(0, 3), n.x, n.y);
      }

      // 节点下方名称：缩小时只保留主要角色与焦点相关节点，避免标签互相覆盖
      const showName = scale >= 0.55 || !isMinor || isFocus || isNeighbor;
      if (showName) {
        ctx.fillStyle = isDimmed ? labelColor : textColor;
        ctx.font = (isMinor ? '11px ' : '12px ') + sans;
        ctx.textBaseline = 'alphabetic';
        ctx.textAlign = 'center';
        ctx.fillText(n.name, n.x, n.y + r + 13);
      }
    }
  };

  const hitTest = (e) => {
    const r = canvas.getBoundingClientRect();
    const w = toWorld(e.clientX - r.left, e.clientY - r.top);
    for (let i = nodes.length - 1; i >= 0; i--) {
      const n = nodes[i];
      const radius = n.r + 3;
      if ((w.x - n.x) ** 2 + (w.y - n.y) ** 2 < radius ** 2) return i;
    }
    return -1;
  };

  const selectNode = (i) => {
    selected = i;
    draw();
    const info = document.getElementById('graphInfo');
    if (i < 0) {
      info.innerHTML = '<div class="empty-state">点击图中节点或右侧角色卡片，查看该角色的故事功能、欲望 / 恐惧、当前状态与关系。</div>';
      return;
    }
    const n = nodes[i];
    const fields = [
      ['故事功能', n.func],
      ['欲望', n.desire],
      ['恐惧', n.fear],
      ['当前状态', n.state],
      ['弧线', n.arc],
      ['秘密', n.secrets],
    ].filter(a => a[1]);
    const rels = edges.filter(e => e.s === i || e.t === i).map(e => {
      const o = nodes[e.s === i ? e.t : e.s];
      // 连线上显示单词标签；悬停可看原始完整描述
      const tip = e.desc && e.desc !== e.label ? ` title="${Utils.escHtml(e.desc)}"` : '';
      return `<div class="rel-item"${tip}><span class="rname">${Utils.escHtml(o.name)}</span>${e.label ? ' — ' + MDParser.parseInline(e.label) : ''}</div>`;
    });
    info.innerHTML = `<div class="name">${Utils.escHtml(n.name)}</div><div class="tier">${Utils.escHtml(n.tier)}</div>` +
      (fields.length ? `<dl>${fields.map(([k, v]) => `<dt>${Utils.escHtml(k)}</dt><dd>${MDParser.parseInline(v)}</dd>`).join('')}</dl>` : '') +
      (rels.length ? `<div class="rels">${rels.join('')}</div>` : '');
  };

  // 主题切换后重绘（刷新 CSS 变量缓存并绘制最新帧）
  const redraw = () => {
    if (!ctx || !canvas) return;
    Utils.theme.refresh();
    draw();
  };

  // 公开 resize 方法，供标签切换时重新计算 canvas 尺寸
  const triggerResize = () => { if (canvas && ctx) resize(); };

  return { init, start, pause, resume, destroy, redraw, selectNode, hitTest, triggerResize, zoomBy, zoomFit, zoomReset };
})();

/* ---------- Characters 组件（人物关系） ---------- */
const Characters = {
  _lastVersion: -1,
  _searchQuery: '',
  _filterTier: 'all',

  onEnter() {
    if (Store.state.dataVersion !== this._lastVersion) {
      this.render();
    } else {
      // 从其他标签切回时，canvas 尺寸可能因 display:none 而为 0，需重新计算
      GraphEngine.triggerResize();
      GraphEngine.resume();
    }
  },

  onLeave() {
    GraphEngine.pause();
  },

  // force 刷新同一标签时调用，跳过 onLeave/onEnter 竞态
  onReload() {
    // 销毁旧图并重新初始化（pause 由 force 路径跳过，此处无需调用）
    GraphEngine.destroy();
    this.render();
  },

  render() {
    const roles = Store.get('roles');
    const graph = buildGraph(roles, (Store.get('files') || {}).current_state);
    Store.set('graph', graph);

    document.getElementById('panel-chars').innerHTML = `
      <h2>人物关系</h2>
      <p class="lede">滚轮缩放 · 拖拽空白平移 · 双击适应画布。点击节点查看角色详情。</p>
      <div class="char-controls">
        <input type="search" id="charSearch" placeholder="搜索角色名称..." class="search-input">
        <select id="charFilter" class="filter-select">
          <option value="all">全部角色</option>
          <option value="major">主要角色</option>
          <option value="minor">次要角色</option>
        </select>
      </div>
      <div class="section-title">关系图</div>
      <div class="graph-layout">
        <div class="graph-canvas-wrap">
          <canvas id="graph"></canvas>
          <div class="graph-tools">
            <button id="graphZoomIn" title="放大" aria-label="放大">＋</button>
            <button id="graphZoomOut" title="缩小" aria-label="缩小">－</button>
            <button id="graphFit" title="适应画布" aria-label="适应画布">⛶</button>
            <button id="graphReset" title="重置为 100%" aria-label="重置为 100%">1:1</button>
          </div>
          <div class="graph-hint">滚轮缩放 · 拖拽平移 · 双击适应</div>
        </div>
        <div class="graph-sidebar">
          <div class="card" id="graphInfo">
            <div class="empty-state">点击图中节点或右侧角色卡片，查看该角色的故事功能、欲望 / 恐惧、当前状态与关系。</div>
          </div>
        </div>
      </div>
      <div class="section-title">角色列表</div>
      <div class="char-list" id="charList"></div>
    `;

    // 延迟到下一帧初始化，确保面板可见且布局完成，canvas 有正确尺寸
    requestAnimationFrame(() => {
      GraphEngine.init(document.getElementById('graph'), graph);
    });
    document.getElementById('graphZoomIn').addEventListener('click', () => GraphEngine.zoomBy(1.3));
    document.getElementById('graphZoomOut').addEventListener('click', () => GraphEngine.zoomBy(1 / 1.3));
    document.getElementById('graphFit').addEventListener('click', () => GraphEngine.zoomFit());
    document.getElementById('graphReset').addEventListener('click', () => GraphEngine.zoomReset());
    this._renderCharList(graph.nodes);
    this._renderGraphTextAlt(graph);

    const searchInput = document.getElementById('charSearch');
    const filterSelect = document.getElementById('charFilter');
    searchInput.addEventListener('input', (e) => {
      this._searchQuery = e.target.value;
      this._renderCharList(graph.nodes);
    });
    filterSelect.addEventListener('change', (e) => {
      this._filterTier = e.target.value;
      this._renderCharList(graph.nodes);
    });

    document.getElementById('charList').addEventListener('click', (e) => {
      const c = e.target.closest('.charcard');
      if (c) {
        const i = parseInt(c.dataset.i);
        GraphEngine.selectNode(i);
        document.querySelectorAll('.charcard').forEach(el => el.style.borderColor = '');
        c.style.borderColor = 'var(--accent)';
      }
    });

    this._lastVersion = Store.state.dataVersion;
  },

  // Canvas 的等价文字关系列表（供屏幕阅读器使用）
  _renderGraphTextAlt(graph) {
    const container = document.getElementById('graphTextAlt');
    if (!container) return;
    if (!graph.nodes.length) { container.innerHTML = '<p>暂无角色数据</p>'; return; }
    const items = graph.nodes.map(n => {
      const rels = graph.edges.filter(e => e.s === n.i || e.t === n.i)
        .map(e => { const o = graph.nodes[e.s === n.i ? e.t : e.s]; return o.name + (e.label ? '（' + e.label + '）' : ''); });
      return `<li>${Utils.escHtml(n.name)} — ${Utils.escHtml(n.tier)}${rels.length ? '：' + rels.join('、') : ''}</li>`;
    }).join('');
    container.innerHTML = `<p>角色关系列表（共 ${graph.nodes.length} 个角色）：</p><ul>${items}</ul>`;
  },

  _renderCharList(nodes) {
    const query = this._searchQuery.toLowerCase().trim();
    const filter = this._filterTier;
    const filtered = nodes.filter(n => {
      if (filter === 'major' && /次要|minor/.test(n.tier)) return false;
      if (filter === 'minor' && !/次要|minor/.test(n.tier)) return false;
      if (query && !n.name.toLowerCase().includes(query)) return false;
      return true;
    });
    document.getElementById('charList').innerHTML = filtered.length
      ? filtered.map(nd => `
        <div class="charcard ${/次要|minor/.test(nd.tier) ? 'minor' : 'major'}" data-i="${nd.i}">
          <div class="name">${Utils.escHtml(nd.name)}<span class="tier-badge ${/次要|minor/.test(nd.tier) ? 'minor' : 'major'}">${/次要|minor/.test(nd.tier) ? '次要' : '主要'}</span></div>
          ${nd.func ? `<div class="tier">${MDParser.parseInline(nd.func)}</div>` : ''}
          ${nd.desire ? `<div class="kv"><b>欲</b>${MDParser.parseInline(nd.desire)}</div>` : ''}
          ${nd.fear ? `<div class="kv"><b>惧</b>${MDParser.parseInline(nd.fear)}</div>` : ''}
          ${nd.state ? `<div class="kv"><b>今</b>${MDParser.parseInline(nd.state)}</div>` : ''}
          ${nd.arc ? `<div class="kv"><b>弧</b>${MDParser.parseInline(nd.arc)}</div>` : ''}
        </div>`).join('')
      : '<div class="empty-state" style="grid-column:1/-1">没有匹配的角色</div>';
  },
};

/* ---------- Reader 组件（章节阅读） ---------- */
const Reader = {
  _lastVersion: -1,
  _lastBookId: null,
  currentIndex: -1,
  _fontSize: 17,
  // 搜索状态（Reader 属性，避免跨方法 ReferenceError）
  _marks: [],
  _currentMatch: -1,
  _cleanHtml: '',

  onEnter() {
    // 刷新同一本书时尽量保留当前章节号；切书时重置
    const newBookId = Store.get('bookId');
    if (this._lastBookId !== newBookId) {
      this.currentIndex = -1;
      this._lastBookId = newBookId;
    }
    if (Store.state.dataVersion !== this._lastVersion) this.render();
  },

  render() {
    const chapters = Store.get('chapters');

    document.getElementById('panel-read').innerHTML = `
      <h2>阅读章节</h2>
      <p class="lede">在仪表盘内直接阅读任意章节。</p>
      <div class="reader-controls">
        <label>字号：<input type="range" id="fontSizeSlider" min="13" max="28" value="${this._fontSize}" step="1">
        <span id="fontSizeLabel">${this._fontSize}px</span></label>
      </div>
      <div class="reader">
        <nav class="toc" id="toc" role="navigation" aria-label="章节目录">
          <div class="toc-title">目录 · ${chapters.length} 章</div>
        </nav>
        <article class="article" id="article" style="font-size:${this._fontSize}px">
          <div class="empty-state">← 请从左侧目录选择一章</div>
        </article>
      </div>
      <div class="readnav">
        <button id="prevBtn" disabled>‹ 上一章</button>
        <span id="chapterProgress" class="muted"></span>
        <button id="nextBtn" disabled>下一章 ›</button>
      </div>
      <div class="read-actions">
        <button id="exportBtn">📤 导出全本 TXT</button>
        <select id="exportMode" class="filter-select" style="padding:6px 10px">
          <option value="plain">纯正文</option>
          <option value="markdown">保留 Markdown</option>
        </select>
        <span class="muted" style="font-size:13px;margin-left:10px;">按章节顺序合并为单一 txt 文件</span>
      </div>
      <div id="searchBar" class="search-bar" style="display:none" role="search">
        <input type="search" id="chapterSearch" placeholder="搜索当前章节..." aria-label="搜索当前章节内容">
        <span id="searchResult" class="muted" style="font-size:13px" role="status" aria-live="polite"></span>
        <button id="searchPrev" aria-label="上一个匹配项">▲</button>
        <button id="searchNext" aria-label="下一个匹配项">▼</button>
        <button id="searchClose" aria-label="关闭搜索（Esc）">✕</button>
      </div>
    `;

    this._renderToc(chapters);
    this._bindEvents(chapters);

    this._lastVersion = Store.state.dataVersion;
  },

  _renderToc(chapters) {
    const toc = document.getElementById('toc');
    toc.innerHTML = `<div class="toc-title">目录 · ${chapters.length} 章</div>` +
      chapters.map((c, i) => `<button data-i="${i}" class="${i === this.currentIndex ? 'active' : ''}" ${i === this.currentIndex ? 'aria-current="true"' : ''}>
        <span class="ch-no">第 ${c.num || (i + 1)} 回</span>${Utils.escHtml(c.title || c.name)}
      </button>`).join('');
  },

  _bindEvents(chapters) {
    document.getElementById('toc').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (b) this.openChapter(parseInt(b.dataset.i), chapters);
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (this.currentIndex > 0) this.openChapter(this.currentIndex - 1, chapters);
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      if (this.currentIndex < chapters.length - 1) this.openChapter(this.currentIndex + 1, chapters);
    });

    // Reader 标签中左右键翻章（仅在 read 标签生效，不覆盖全局标签切换）
    Utils.shortcuts.register('ArrowLeft', () => {
      if (this.currentIndex > 0) this.openChapter(this.currentIndex - 1, chapters);
    }, 'read');
    Utils.shortcuts.register('ArrowRight', () => {
      if (this.currentIndex < chapters.length - 1) this.openChapter(this.currentIndex + 1, chapters);
    }, 'read');
    // Ctrl+F 只在 Reader 标签拦截，其他标签保留浏览器默认行为
    Utils.shortcuts.register('Ctrl+f', () => {
      if (!this._openSearch) return;
      const bar = document.getElementById('searchBar');
      if (bar.style.display === 'none') this._openSearch();
      else this._closeSearch();
    }, 'read');

    document.getElementById('fontSizeSlider').addEventListener('input', (e) => {
      this._fontSize = parseInt(e.target.value);
      document.getElementById('article').style.fontSize = this._fontSize + 'px';
      document.getElementById('fontSizeLabel').textContent = this._fontSize + 'px';
    });

    document.getElementById('exportBtn').addEventListener('click', () => this._exportTxt(chapters));

    this._bindSearch(chapters);
  },

  openChapter(i, chapters) {
    const ch = chapters[i];
    if (!ch) return;
    this.currentIndex = i;

    document.querySelectorAll('#toc button').forEach((b, k) => b.classList.toggle('active', k === i));

    document.getElementById('article').innerHTML = `
      <h1>${Utils.escHtml(ch.title || ('第 ' + (ch.num || (i + 1)) + ' 回'))}</h1>
      <div class="muted" style="margin-bottom:20px;font-family:var(--sans);font-size:13px;">
        共 ${Utils.fmtNum(Utils.countWords(ch.text))} 字
      </div>
      ${MDParser.parse(ch.text)}
    `;

    document.getElementById('prevBtn').disabled = i <= 0;
    document.getElementById('nextBtn').disabled = i >= chapters.length - 1;
    document.getElementById('chapterProgress').textContent = `第 ${i + 1} / ${chapters.length} 章`;

    // 切章后滚动正确的阅读容器到顶部（main.content 是可滚动容器）
    const article = document.getElementById('article');
    if (article) article.scrollTop = 0;
    const readingContainer = document.querySelector('main.content');
    if (readingContainer) readingContainer.scrollTop = 0;

    // 切换章节时清空旧搜索结果和高亮，保存新的干净 HTML
    this._clearHighlights();
    document.getElementById('chapterSearch').value = '';
    document.getElementById('searchResult').textContent = '';
    this._saveCleanHtml();

    if (Router.current !== 'read') Router.switchTab('read');
  },

  _bindSearch(chapters) {
    const input = document.getElementById('chapterSearch');
    const result = document.getElementById('searchResult');
    const prevBtn = document.getElementById('searchPrev');
    const nextBtn = document.getElementById('searchNext');
    const closeBtn = document.getElementById('searchClose');
    // 搜索状态通过 this._marks / this._currentMatch / this._cleanHtml 访问（Reader 属性）

    input.addEventListener('input', () => {
      const ch = chapters[this.currentIndex];
      if (!ch || !input.value.trim()) { this._marks = []; this._currentMatch = -1; result.textContent = ''; this._clearHighlights(); return; }
      // 每次新搜索前恢复到干净 HTML
      document.getElementById('article').innerHTML = this._cleanHtml;
      this._highlightText(input.value);
    });

    prevBtn.addEventListener('click', () => {
      if (this._marks.length === 0) return;
      this._currentMatch = (this._currentMatch - 1 + this._marks.length) % this._marks.length;
      this._updateCurrentMark();
      result.textContent = `${this._currentMatch + 1}/${this._marks.length}`;
    });

    nextBtn.addEventListener('click', () => {
      if (this._marks.length === 0) return;
      this._currentMatch = (this._currentMatch + 1) % this._marks.length;
      this._updateCurrentMark();
      result.textContent = `${this._currentMatch + 1}/${this._marks.length}`;
    });

    // 保存原焦点，关闭搜索条后恢复
    let savedFocus = null;
    const openSearch = () => {
      savedFocus = document.activeElement;
      bar.style.display = 'flex';
      input.focus();
    };
    const closeSearch = () => {
      bar.style.display = 'none';
      input.value = '';
      this._marks = [];
      this._currentMatch = -1;
      this._cleanHtml = '';
      this._clearHighlights();
      // 关闭后恢复焦点到之前聚焦的元素
      if (savedFocus && savedFocus.focus) try { savedFocus.focus(); } catch {}
    };
    closeBtn.addEventListener('click', closeSearch);

    // Escape 关闭搜索条并恢复焦点
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); closeSearch(); }
    });

    // 暴露 openSearch 供 Ctrl+F 调用
    this._openSearch = openSearch;
    this._closeSearch = closeSearch;
  },

  // 在打开章节时保存干净 HTML，供搜索恢复用
  _saveCleanHtml() {
    const article = document.getElementById('article');
    if (!article) return; // article 不存在时安全返回
    this._cleanHtml = article.innerHTML;
    this._marks = [];
    this._currentMatch = -1;
  },

  // 仅操作文本节点的高亮：用 TreeWalker 遍历，避免破坏 HTML 标签和属性
  _highlightText(query) {
    const article = document.getElementById('article');
    const result = document.getElementById('searchResult');
    this._clearHighlights();
    if (!query.trim()) { result.textContent = ''; return; }

    const escQ = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    // 节点筛选使用不带 g 的 tester 正则，避免 lastIndex 污染
    const tester = new RegExp('(' + escQ + ')', 'i');
    // 真正拆分文本时再使用带 g 的 matcher 正则
    const matcher = new RegExp('(' + escQ + ')', 'gi');
    this._marks = [];
    this._currentMatch = -1;

    // 遍历所有文本节点
    const walker = document.createTreeWalker(article, NodeFilter.SHOW_TEXT, {
      acceptNode: (node) => {
        // 跳过已有 mark 内的节点和 script/style
        const parent = node.parentElement;
        if (parent && (parent.tagName === 'MARK' || parent.tagName === 'SCRIPT' || parent.tagName === 'STYLE')) return NodeFilter.FILTER_REJECT;
        return tester.test(node.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });

    // 先收集所有需要处理的节点（遍历时不能直接修改 DOM）
    const nodesToProcess = [];
    let n;
    while ((n = walker.nextNode())) nodesToProcess.push(n);

    for (const textNode of nodesToProcess) {
      const text = textNode.nodeValue;
      const frag = document.createDocumentFragment();
      let lastIndex = 0;
      let match;
      matcher.lastIndex = 0;
      while ((match = matcher.exec(text)) !== null) {
        // 匹配前的文本
        if (match.index > lastIndex) {
          frag.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
        }
        // 包裹匹配项
        const mark = document.createElement('mark');
        mark.textContent = match[1];
        mark.dataset.matchIdx = this._marks.length; // 记录全局序号
        frag.appendChild(mark);
        this._marks.push(mark);
        lastIndex = match.index + match[1].length;
      }
      if (frag.childNodes.length > 0) {
        if (lastIndex < text.length) {
          frag.appendChild(document.createTextNode(text.slice(lastIndex)));
        }
        textNode.parentNode.replaceChild(frag, textNode);
      }
    }

    if (this._marks.length > 0) {
      this._currentMatch = 0;
      this._updateCurrentMark();
      result.textContent = `1/${this._marks.length}`;
      // 自动滚动到第一个命中
      this._marks[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
    } else {
      result.textContent = '无匹配';
    }
  },

  _updateCurrentMark() {
    this._marks.forEach((m, i) => {
      const isCurrent = i === this._currentMatch;
      m.classList.toggle('current', isCurrent);
      // 当前匹配使用 aria-current 或可读状态
      if (isCurrent) m.setAttribute('aria-current', 'true');
      else m.removeAttribute('aria-current');
    });
    if (this._marks[this._currentMatch]) {
      this._marks[this._currentMatch].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  },

  _clearHighlights() {
    const article = document.getElementById('article');
    if (!article) return; // article 不存在时安全返回
    const existing = article.querySelectorAll('mark');
    existing.forEach(mark => {
      const parent = mark.parentNode;
      parent.replaceChild(document.createTextNode(mark.textContent), mark);
      parent.normalize(); // 合并相邻文本节点
    });
    this._marks = [];
    this._currentMatch = -1;
  },

  _exportTxt(chapters) {
    if (!chapters.length) { alert('暂无章节可导出'); return; }
    const book = Store.get('book');
    const modeSelect = document.getElementById('exportMode');
    const mode = modeSelect ? modeSelect.value : 'plain';
    const isMarkdown = mode === 'markdown';

    try {
      // 分段构造，避免大书一次性拼接导致内存峰值
      const parts = [];
      parts.push(book.title || '未命名');
      parts.push('='.repeat(40));
      parts.push(`共 ${chapters.length} 章 / 约 ${Utils.fmtNum(chapters.reduce((s, c) => s + Utils.countWords(c.text), 0))} 字`);
      if (isMarkdown) parts.push('（保留 Markdown 格式）');
      else parts.push('（纯正文）');
      parts.push('');

      chapters.forEach((c, i) => {
        parts.push(`\n第 ${c.num || (i + 1)} 回${c.title ? ' · ' + c.title : ''}`);
        parts.push('-'.repeat(30));
        if (isMarkdown) {
          // 保留 Markdown：输出原始文本
          parts.push(c.text.trim());
        } else {
          // 纯正文：剥离 Markdown 语法标记
          parts.push(stripMarkdown(c.text));
        }
      });

      // 统一换行符策略：使用 \n（UTF-8）
      const content = parts.join('\n');
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const safeTitle = (book.title || 'book').replace(/[\/\\:*?"<>|]/g, '_');
      a.download = `${safeTitle}${isMarkdown ? '_md' : ''}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (err) {
      // 导出失败时显示错误
      alert('【导出失败】' + (err && err.message ? err.message : String(err)));
    }
  },
};

/* ---------- 填充 Store（由读文件夹后调用） ---------- */
const populateStore = (data) => {
  Store.set('book', data.book);
  Store.set('chapters', data.chapters);
  Store.set('roles', data.roles);
  Store.set('files', data.files);
  if (data.diagnostics) Store.set('diagnostics', data.diagnostics);

  const book = data.book || {};
  // 记录当前书标识（用于判断切书 vs 刷新，决定保留/重置阅读状态）
  Store.set('bookId', book.id || book.title || null);
  document.getElementById('bookTitle').textContent = book.title || '未命名';
  document.getElementById('bookSub').textContent = [book.genre, book.language === 'zh' ? '中文' : book.language].filter(Boolean).join(' · ');
  document.getElementById('bookStatus').textContent = Utils.statusLabel(book.status);

  // 数据版本 +1，组件据此自动重绘
  Store.bumpVersion();
  // force 刷新同一组件时避免不必要的"旧组件 onLeave → 新组件 onEnter"竞态：
  // 由 Router.switchTab 在 force===tab 时直接调用 onReload，跳过 onLeave/onEnter
  Router.switchTab(Router.current, { force: true });
};

// 统一 invalidate() 生命周期：重置所有组件的渲染缓存
// 注意：数据加载前不调用（仅刷新/切书时调用）；数据加载由 bumpVersion() 驱动自动重绘
function invalidateAll() {
  // 切书时重置阅读状态和搜索状态
  Reader.currentIndex = -1;
  Reader._fontSize = 17;
  Reader._marks = [];
  Reader._currentMatch = -1;
  Reader._cleanHtml = '';
  Characters._searchQuery = '';
  Characters._filterTier = 'all';
}


/* ---------- 入口绑定 + 自动重连 ---------- */
// SourceSession：收拢数据源相关全局状态，避免散落
const SourceSession = (() => {
  let lastHandle = null;
  let cachedEntries = null;
  let autoResumed = false;
  return {
    get handle() { return lastHandle; },
    set handle(h) { lastHandle = h; },
    get entries() { return cachedEntries; },
    set entries(e) { cachedEntries = e; },
    get autoResumed() { return autoResumed; },
    set autoResumed(v) { autoResumed = v; },
    // 刷新、切书、返回落地页时重置
    reset() { lastHandle = null; cachedEntries = null; autoResumed = false; },
    // 是否有可刷新的数据源
    get canRefresh() { return lastHandle || cachedEntries; },
  };
})();

/* ---------- Loading 反馈 ---------- */
const Loading = {
  requestId: 0, // 当前加载请求 ID，防止并发加载覆盖彼此结果
  show(stage) {
    this.requestId++;
    const myId = this.requestId;
    let el = document.getElementById('loadingOverlay');
    if (!el) {
      el = document.createElement('div');
      el.id = 'loadingOverlay';
      el.setAttribute('role', 'status');
      el.setAttribute('aria-live', 'polite');
      el.innerHTML = '<div class="spinner"></div><span id="loadingStage">加载中…</span>';
      document.body.appendChild(el);
    }
    el.style.display = 'flex';
    const stageEl = document.getElementById('loadingStage');
    if (stageEl) stageEl.textContent = stage || '加载中…';
    // 加载时禁用重复选择按钮，防止多次并发加载
    document.getElementById('pickBtn').disabled = true;
    document.getElementById('compatBtn').disabled = true;
    return myId; // 返回本次请求 ID，供 hide 时校验
  },
  hide(requestId) {
    // 仅最新请求可隐藏遮罩，防止过期结果覆盖新结果
    if (requestId && requestId !== this.requestId) return;
    const el = document.getElementById('loadingOverlay');
    if (el) el.style.display = 'none';
    document.getElementById('pickBtn').disabled = false;
    document.getElementById('compatBtn').disabled = false;
  },
  setStage(text) {
    const el = document.getElementById('loadingStage');
    if (el) el.textContent = text;
  },
};

const initApp = () => {
  Utils.theme.init();
  const themeBtn = document.getElementById('themeBtn');
  const themeLabel = m => m === 'dark' ? '深色' : m === 'light' ? '浅色' : '自动';
  const updateThemeBtn = (m) => {
    themeBtn.textContent = m === 'dark' ? '☀' : m === 'light' ? '🌙' : '🌓';
    themeBtn.setAttribute('aria-label', `当前主题：${themeLabel(m)}，点击切换`);
  };
  updateThemeBtn(Utils.theme.current);
  themeBtn.addEventListener('click', () => {
    const mode = Utils.theme.toggle();
    updateThemeBtn(mode);
    GraphEngine.redraw(); // 主题切换后重绘关系图
    Appearance.syncMode(); // 同步外观面板中的模式选中态
  });
  Appearance.init();

  document.getElementById('pickBtn').addEventListener('click', pickFolder);
  document.getElementById('compatBtn').addEventListener('click', () => document.getElementById('fileInput').click());
  document.getElementById('refreshBtn').addEventListener('click', () => {
    if (SourceSession.handle) loadBookFromHandle(SourceSession.handle);
    else if (SourceSession.entries) loadBookFromEntries(SourceSession.entries);
    else pickFolder();
  });
  document.getElementById('rePickBtn').addEventListener('click', () => {
    document.body.classList.remove('loaded');
    Store.reset();
    SourceSession.reset();
    pickFolder();
  });

  document.getElementById('fileInput').addEventListener('change', async (e) => {
    if (e.target.files.length) {
      // 不在验证成功前覆盖 cachedEntries（loadBookFromEntries 成功后设置）
      await loadBookFromEntries(Array.from(e.target.files));
    }
  });

  Router.register('overview', Overview);
  Router.register('settings-content', SettingsContent);
  Router.register('chars', Characters);
  Router.register('read', Reader);

  // 标签键盘导航（全局注册；Reader 标签中同名键会优先匹配 Reader 的处理器）
  const tabList = ['overview', 'settings-content', 'chars', 'read'];
  const switchTabAndFocus = (tab) => {
    Router.switchTab(tab);
    // 切换后焦点移动到新 tab
    const btn = document.querySelector(`.tabs [role="tab"][data-tab="${tab}"]`);
    if (btn) btn.focus();
  };
  Utils.shortcuts.register('ArrowLeft', () => {
    const idx = tabList.indexOf(Router.current);
    if (idx > 0) switchTabAndFocus(tabList[idx - 1]);
  }, 'global');
  Utils.shortcuts.register('ArrowRight', () => {
    const idx = tabList.indexOf(Router.current);
    if (idx >= 0 && idx < tabList.length - 1) switchTabAndFocus(tabList[idx + 1]);
  }, 'global');
  // Home/End 跳转第一个/最后一个 tab
  Utils.shortcuts.register('Home', () => switchTabAndFocus(tabList[0]), 'global');
  Utils.shortcuts.register('End', () => switchTabAndFocus(tabList[tabList.length - 1]), 'global');

  Router.init();
};

async function pickFolder() {
  if (window.showDirectoryPicker) {
    try {
      const handle = await window.showDirectoryPicker({ mode: "read", id: "dragon-writer-book" });
      document.getElementById('resumeName').textContent = handle.name;
      SourceSession.autoResumed = false;
      await loadBookFromHandle(handle);
    } catch (e) {
      // AbortError = 用户取消选择，静默忽略；其他错误明确提示
      if (e && e.name === "AbortError") return;
      console.error("选择书架失败", e);
      alert('【选择失败】' + (e && e.message ? e.message : String(e)));
    }
  } else { document.getElementById('fileInput').click(); }
}

// 分类错误类型，给出明确提示
function classifyError(err) {
  const msg = (err && err.message) ? err.message : String(err);
  if (/(权限|permission|denied|NotAllowedError)/i.test(msg)) return { type: 'permission', label: '权限被拒绝' };
  if (/(book.json|JSON|解析|parse)/i.test(msg)) return { type: 'json', label: 'book.json 解析错误' };
  if (/(未找到|chapters|目录结构|missing)/i.test(msg)) return { type: 'structure', label: '目录结构错误' };
  if (/(读取|read|file|IOError|NotFoundError)/i.test(msg)) return { type: 'io', label: '文件读取错误' };
  return { type: 'unknown', label: '未知错误' };
}

const loadBookFromHandle = async (handle) => {
  const reqId = Loading.show('正在验证目录…');
  Store.set('loading', true);
  try {
    Loading.setStage('读取文件…');
    const data = await loadBook(handle, null);
    if (data) {
      // 加载成功后才提交数据源，避免覆盖上一份有效数据
      GraphEngine.destroy();
      SourceSession.handle = handle;
      SourceSession.entries = null;
      document.getElementById('refreshBtn').style.display = 'inline-block';
      populateStore(data);
      document.body.classList.add('loaded');
    }
  } catch (err) {
    Store.set('error', err.message);
    Loading.hide(reqId);
    // 加载失败时保留上一份可刷新数据源，不覆盖 SourceSession
    // 明确提示当前仍显示哪一本书 + 错误类型分类
    const currentBook = Store.get('book');
    const currentTitle = currentBook && currentBook.title ? `《${currentBook.title}》` : '（未加载）';
    const klass = classifyError(err);
    if (!SourceSession.autoResumed) alert(`【${klass.label}】${err.message}\n\n当前仍显示：${currentTitle}`);
  } finally {
    Store.set('loading', false);
    Loading.hide(reqId);
  }
};

const loadBookFromEntries = async (entries) => {
  const reqId = Loading.show('正在验证目录…');
  Store.set('loading', true);
  try {
    Loading.setStage('读取文件…');
    const data = await loadBook(null, entries);
    if (data) {
      // 加载成功后才提交数据源，避免覆盖上一份有效数据
      GraphEngine.destroy();
      SourceSession.entries = Array.from(entries);
      SourceSession.handle = null;
      document.getElementById('refreshBtn').style.display = 'inline-block';
      populateStore(data);
      document.body.classList.add('loaded');
    }
  } catch (err) {
    Store.set('error', err.message);
    Loading.hide(reqId);
    // 加载失败时保留上一份可刷新数据源
    const currentBook = Store.get('book');
    const currentTitle = currentBook && currentBook.title ? `《${currentBook.title}》` : '（未加载）';
    const klass = classifyError(err);
    if (!SourceSession.autoResumed) alert(`【${klass.label}】${err.message}\n\n当前仍显示：${currentTitle}`);
  } finally {
    Store.set('loading', false);
    Loading.hide(reqId);
  }
};

async function tryResumeSilent(h) {
  try {
    // 先 queryPermission（不会弹窗），仅 granted 时才静默恢复
    const perm = await h.queryPermission({ mode: "read" });
    if (perm === "granted") {
      SourceSession.autoResumed = true;
      await loadBookFromHandle(h);
      return true;
    }
    // 非 granted 时不强制弹窗，返回 false 等待用户点击
    return false;
  } catch (err) { console.warn("自动恢复书架失败", err); return false; }
}

// 用户点击"继续"后请求权限并加载
async function resumeWithPermission(h) {
  try {
    let perm = await h.queryPermission({ mode: "read" });
    if (perm !== "granted") perm = await h.requestPermission({ mode: "read" });
    if (perm === "granted") {
      SourceSession.autoResumed = true;
      await loadBookFromHandle(h);
      return true;
    }
    // 权限被拒绝：显示明确的"点击授权并继续"提示
    alert('【权限被拒绝】请在浏览器地址栏点击"重新授权"，或重新选择书文件夹。');
    return false;
  } catch (err) { console.warn("授权恢复失败", err); return false; }
}

/* ---------- 启动 ---------- */
(async () => {
  initApp();

  if (window.showDirectoryPicker) {
    try {
      const h = await IDB.load('last');
      if (h) {
        // 显示"上次打开"入口（权限仍有效时自动重连，否则等待用户点击）
        document.getElementById('resumeArea').style.display = 'block';
        document.getElementById('resumeName').textContent = h.name;
        document.getElementById('resumeLink').addEventListener('click', async (e) => {
          e.preventDefault();
          // 用户点击后请求权限并继续
          await resumeWithPermission(h);
        });
        // 尝试静默恢复（仅权限仍有效时自动重连，不承诺永久零交互）
        const resumed = await tryResumeSilent(h);
        if (resumed) {
          // 自动恢复成功后隐藏多余恢复入口
          document.getElementById('resumeArea').style.display = 'none';
        }
      }
    } catch (e) { /* 首次访问 / 无句柄：停留落地页 */ }
  }
})();
