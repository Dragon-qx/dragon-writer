<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
<title>Dragon Writer · 写作仪表盘</title>
<style>
/* ========== CSS 变量系统 ========== */
:root {
  --bg: #f5f6f8;
  --bg-elevated: #ffffff;
  --bg-subtle: #eef0f4;
  --text: #17191f;
  --text-muted: #68707d;
  --border: #e3e6ec;
  --accent: #4f46e5;
  --accent-soft: #edeefc;
  --success: #15803d;
  --danger: #dc2626;
  --warning: #b45309;
  --track: #e6e8ee;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.05);
  --mono: ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
  --serif: "Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --sans: -apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  --font-size-base: 14px;
  --transition-fast: 150ms ease;
  --transition-normal: 200ms ease;
}
@media(prefers-color-scheme:dark) {
  :root.theme-auto {
    --bg: #0e1014; --bg-elevated: #15181e; --bg-subtle: #1d2129;
    --text: #e7e9ee; --text-muted: #98a0ad; --border: #262b35;
    --accent: #818cf8; --accent-soft: #23263f; --success: #4ade80;
    --warning: #e2a34a; --danger: #e06565;
    --track: #232833; --shadow: 0 1px 2px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.4);
  }
}
:root.theme-dark {
  --bg: #0e1014; --bg-elevated: #15181e; --bg-subtle: #1d2129;
  --text: #e7e9ee; --text-muted: #98a0ad; --border: #262b35;
  --accent: #818cf8; --accent-soft: #23263f; --success: #4ade80;
  --warning: #e2a34a; --danger: #e06565;
  --track: #232833; --shadow: 0 1px 2px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.4);
}
:root.theme-light {
  --bg: #f5f6f8; --bg-elevated: #ffffff; --bg-subtle: #eef0f4;
  --text: #17191f; --text-muted: #68707d; --border: #e3e6ec;
  --accent: #4f46e5; --accent-soft: #edeefc; --success: #15803d;
  --track: #e6e8ee; --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.05);
}

/* ========== 主题色方案（与浅色/深色模式正交，通过 data-scheme 切换） ========== */
/* 默认靛蓝即 :root 基础值，无需额外规则；其余方案覆盖 accent 两色 */
:root[data-scheme="ocean"]  { --accent:#0369a1; --accent-soft:#e0f0fa; }
:root[data-scheme="forest"] { --accent:#047857; --accent-soft:#e2f4ec; }
:root[data-scheme="sunset"] { --accent:#c2410c; --accent-soft:#fbe9dd; }
:root[data-scheme="rose"]   { --accent:#be123c; --accent-soft:#fbe4e9; }
:root[data-scheme="violet"] { --accent:#7c3aed; --accent-soft:#efe9fd; }
/* 深色模式下的方案色（手动深色 + 跟随系统深色） */
:root.theme-dark[data-scheme="ocean"]  { --accent:#38bdf8; --accent-soft:#0f2a3d; }
:root.theme-dark[data-scheme="forest"] { --accent:#34d399; --accent-soft:#14291f; }
:root.theme-dark[data-scheme="sunset"] { --accent:#fb923c; --accent-soft:#33200f; }
:root.theme-dark[data-scheme="rose"]   { --accent:#fb7185; --accent-soft:#331520; }
:root.theme-dark[data-scheme="violet"] { --accent:#a78bfa; --accent-soft:#26184a; }
@media(prefers-color-scheme:dark) {
  :root.theme-auto[data-scheme="ocean"]  { --accent:#38bdf8; --accent-soft:#0f2a3d; }
  :root.theme-auto[data-scheme="forest"] { --accent:#34d399; --accent-soft:#14291f; }
  :root.theme-auto[data-scheme="sunset"] { --accent:#fb923c; --accent-soft:#33200f; }
  :root.theme-auto[data-scheme="rose"]   { --accent:#fb7185; --accent-soft:#331520; }
  :root.theme-auto[data-scheme="violet"] { --accent:#a78bfa; --accent-soft:#26184a; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
}

/* ========== Reset ========== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;font-size:var(--font-size-base);transition:background-color var(--transition-normal),color var(--transition-normal)}

/* ========== 自定义背景层 ========== */
#bgLayer{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity var(--transition-normal)}
#landing,#app{position:relative;z-index:1}
#bgLayer.pat-dots{opacity:1;background-image:radial-gradient(var(--border) 1.2px,transparent 1.2px);background-size:22px 22px}
#bgLayer.pat-grid{opacity:1;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:28px 28px}
#bgLayer.pat-glow{opacity:1;background:radial-gradient(ellipse 60% 45% at 15% 0%,var(--accent-soft) 0%,transparent 70%),radial-gradient(ellipse 50% 42% at 96% 88%,var(--accent-soft) 0%,transparent 70%)}
#bgLayer.pat-image{background-size:cover;background-position:center;background-repeat:no-repeat}

/* ========== 按钮 ========== */
button{font-family:inherit;cursor:pointer;background:var(--bg-elevated);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 14px;font-size:var(--font-size-base);font-weight:500;box-shadow:0 1px 2px rgba(16,24,40,.04);transition:background var(--transition-fast),border-color var(--transition-fast),box-shadow var(--transition-fast),transform var(--transition-fast)}
button:hover{background:var(--bg-subtle);border-color:var(--text-muted)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button:disabled:hover{background:var(--bg-elevated);border-color:var(--border)}
button:disabled:active{transform:none}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 1px 3px rgba(79,70,229,.35)}
button.primary:hover{background:var(--accent);filter:brightness(1.08);border-color:var(--accent);box-shadow:0 3px 10px rgba(79,70,229,.4)}
button.primary:disabled{box-shadow:none;filter:none}
input[type=file]{display:none}
label.filelabel{display:inline-block}

/* ========== 落地页 ========== */
#landing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;text-align:center;padding:24px;background:radial-gradient(ellipse 80% 55% at 50% 32%,var(--accent-soft) 0%,transparent 70%)}
#landing .logo{font-size:56px;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.12));animation:logoFloat 4s ease-in-out infinite}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#landing h1{font-size:30px;font-weight:700;margin:0;letter-spacing:-.02em}
#landing p{color:var(--text-muted);max-width:460px;margin:0}
#landing .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#landing .hint{font-size:13px;max-width:500px}
#landing code{background:var(--bg-subtle);padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:12px}
#landing button{padding:10px 18px}
#resumeArea{margin-top:12px}
#resumeArea p{margin:6px 0}
#resumeArea .hint{font-size:13px;color:var(--text-muted)}
#resumeLink{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px dashed var(--accent)}
#resumeLink:hover{border-bottom-style:solid}

/* ========== Loading ========== */
.loading{display:flex;align-items:center;gap:10px;color:var(--text-muted)}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadingOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;align-items:center;justify-content:center;gap:12px;color:#fff;font-size:15px}
#loadingOverlay .spinner{width:28px;height:28px;border-color:rgba(255,255,255,.3);border-top-color:#fff}

/* ========== Layout Grid ========== */
#app{display:none;min-height:100vh}
body.loaded #landing{display:none}
body.loaded #app{display:grid;grid-template-rows:auto 1fr}
.layout{display:grid;grid-template-columns:180px minmax(0,1fr)}
/* 宽屏（≥1280px）：右侧增加标题目录列 */
@media(min-width:1280px){.layout{grid-template-columns:180px minmax(0,1fr) 216px}}

/* ========== Appbar ========== */
.appbar{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--bg-elevated);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
@supports(backdrop-filter:blur(10px)) {
  .appbar{background:color-mix(in srgb,var(--bg-elevated) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
}
.appbar .bookmeta{display:flex;align-items:baseline;gap:10px;min-width:0}
.appbar .booktitle{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .booksub{color:var(--text-muted);font-size:13px;white-space:nowrap}
.appbar .spacer{flex:1}
.appbar .badge{background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}

/* ========== Tabs ========== */
.tabs[role="tablist"]{border-right:1px solid var(--border);background:var(--bg-elevated);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:53px;align-self:start;height:calc(100vh - 53px)}
.tabs button[role="tab"]{text-align:left;border:none;background:transparent;border-radius:var(--radius-sm);padding:10px 12px 10px 14px;color:var(--text-muted);font-size:var(--font-size-base);cursor:pointer;position:relative;transition:background var(--transition-fast),color var(--transition-fast)}
.tabs button[role="tab"]:hover{background:var(--bg-subtle);color:var(--text)}
.tabs button[role="tab"][aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tabs button[role="tab"][aria-selected="true"]::before{content:'';position:absolute;left:4px;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:2px;background:var(--accent)}
.tabs .navlabel{font-size:11px;letter-spacing:.08em;color:var(--text-muted);padding:14px 12px 6px;text-transform:uppercase}

/* ========== Content ========== */
main.content{padding:28px 32px 60px;max-width:1100px;width:100%;min-width:0;margin:0 auto}
.panel{display:none}
.panel.active{display:block;animation:panelIn .28s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel h2{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px}
.panel .lede{color:var(--text-muted);margin:0 0 24px}

/* ========== 基本组件 ========== */
.card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.grid{display:grid;gap:16px}
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat.card{transition:transform var(--transition-normal),box-shadow var(--transition-normal)}
.stat.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 8px 20px rgba(0,0,0,.07)}
.empty-state{text-align:center;color:var(--text-muted);padding:40px 20px}
.empty-state .icon{font-size:40px;margin-bottom:12px}
.stat .label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.stat .value{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px}
.stat .value small{font-size:14px;color:var(--text-muted);font-weight:400}
.muted{color:var(--text-muted)}
.section-title{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.06em;color:var(--text-muted);margin:28px 0 12px}
.section-title::before{content:'';width:3px;height:13px;border-radius:2px;background:var(--accent);flex-shrink:0}
.col2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

/* ========== Overview 组件 ========== */
@property --p{syntax:'<percentage>';inherits:false;initial-value:0%}
.ringwrap{display:flex;align-items:center;gap:20px}
.ring{width:80px;height:80px;border-radius:50%;background:conic-gradient(var(--accent) 0% var(--p,0%),var(--track) var(--p,0%) 100%);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;transition:--p .9s cubic-bezier(.22,.8,.36,1)}
.ring::before{content:'';position:absolute;width:62px;height:62px;border-radius:50%;background:var(--bg-elevated)}
.ring .num{position:relative;z-index:1;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.ring .pct-sym{font-size:11px;font-weight:400;color:var(--text-muted)}
.ringcaption{font-size:13px;margin-bottom:2px}
.ringcaption.muted{font-size:12px}
.state-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.state-item{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--bg-subtle);border-radius:var(--radius-sm)}
.state-item b{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.state-item span{font-size:14px;line-height:1.5}
.table-wrap{overflow-x:auto}
.table-wrap table{width:100%;border-collapse:collapse;font-size:13px}
.table-wrap th,.table-wrap td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.table-wrap th{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.drift-section{margin-bottom:16px}
.drift-title{font-weight:600;margin-bottom:6px;color:var(--accent)}
.drift-title.is-fixed{color:var(--success)}
.drift-title.is-open{color:var(--warning)}
.drift-item{margin-bottom:10px;padding-left:8px;border-left:2px solid var(--border)}
.drift-item.is-fixed{border-left-color:var(--success)}
.drift-item.is-open{border-left-color:var(--warning)}
.drift-item b{font-size:13px}
.drift-item .muted{font-size:12px;margin-top:2px}
.article{line-height:1.8;font-size:14px}
.article p{margin:0 0 12px}
.article h1,.article h2,.article h3,.article h4{margin:20px 0 8px;font-family:var(--serif)}
.article table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}
.article th,.article td{text-align:left;padding:6px 10px;border:1px solid var(--border)}
.article th{background:var(--bg-subtle)}
.article code{background:var(--bg-subtle);padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:12px}
.article pre code{display:block;padding:12px;overflow-x:auto}
.article ul,.article ol{padding-left:20px;margin:8px 0}
.article blockquote{border-left:3px solid var(--accent);margin:12px 0;padding:8px 16px;background:var(--bg-subtle);border-radius:0 var(--radius-sm) var(--radius-sm) 0}

/* ========== Graph 关系图 ========== */
.graph-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;height:420px;max-height:70vh}
.graph-canvas-wrap{background:var(--bg-elevated);background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;position:relative;height:100%;min-height:0}
.graph-canvas-wrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.graph-tools{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.graph-tools button{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);color:var(--text-muted)}
.graph-tools button:hover{color:var(--accent);border-color:var(--accent);background:var(--bg-elevated)}
.graph-hint{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--text-muted);background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;padding:2px 10px;opacity:.85;pointer-events:none;z-index:2}
.graph-sidebar{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto}
#graphInfo{font-size:13px;line-height:1.6}
#graphInfo .name{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
#graphInfo .tier{font-size:12px;color:var(--text-muted);margin-bottom:8px}
#graphInfo dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:13px}
#graphInfo dt{color:var(--text-muted);white-space:nowrap}
#graphInfo dd{margin:0}
#graphInfo .rels{margin-top:10px;border-top:1px solid var(--border);padding-top:8px}
#graphInfo .rel-item{margin-bottom:4px}
#graphInfo .rname{font-weight:600}
#charList{display:flex;flex-direction:column;gap:6px;max-height:400px;overflow-y:auto}
.charcard{padding:10px 12px;background:var(--bg-subtle);border-radius:var(--radius-sm);border:2px solid transparent;cursor:pointer;transition:border-color var(--transition-fast),background var(--transition-fast)}
.charcard.major{border-left:3px solid var(--accent)}
.charcard.minor{border-left:3px solid var(--border)}
.charcard:hover{background:var(--border)}
.charcard .name{font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tier-badge{flex-shrink:0;padding:1px 8px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.03em}
.tier-badge.major{background:var(--accent-soft);color:var(--accent)}
.tier-badge.minor{background:var(--bg-elevated);color:var(--text-muted);border:1px solid var(--border)}
.charcard .tier{font-size:11px;color:var(--text-muted);margin-bottom:4px}
.charcard .kv{font-size:12px;color:var(--text-muted);display:flex;gap:4px}
.charcard .kv b{color:var(--text);min-width:16px}

/* ========== 人物搜索控件 ========== */
.char-controls{display:flex;gap:12px;margin-bottom:20px}
.search-input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-elevated);color:var(--text);font-family:inherit;font-size:var(--font-size-base);outline:none;transition:border-color var(--transition-fast)}
.search-input:focus{border-color:var(--accent)}
.filter-select{padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-elevated);color:var(--text);font-family:inherit;font-size:var(--font-size-base);cursor:pointer}

/* ========== 设定内容（折叠卡片） ========== */
.settingfile{margin-bottom:14px;padding:0;overflow:hidden}
.settingfile .row{display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer;user-select:none;transition:background var(--transition-fast)}
.settingfile .row:hover{background:var(--bg-subtle)}
.settingfile .chev{font-size:10px;color:var(--text-muted);transition:transform var(--transition-normal);flex-shrink:0}
.settingfile.open .chev{transform:rotate(90deg)}
.settingfile .name{flex:1;font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.settingfile .pct{font-weight:700;font-size:14px;flex-shrink:0}
.settingfile .tag{background:var(--bg-subtle);color:var(--text-muted);padding:2px 10px;border-radius:999px;font-size:12px;flex-shrink:0}
.settingfile .body{display:none;border-top:1px solid var(--border);padding:18px 24px 22px}
.settingfile.open .body{display:block;animation:panelIn .25s ease}

/* ========== 阅读器 ========== */
.reader-controls{display:flex;align-items:center;gap:14px;margin-bottom:16px;color:var(--text-muted);font-size:13px}
.reader-controls label{display:flex;align-items:center;gap:10px}
.reader-controls input[type=range]{accent-color:var(--accent);cursor:pointer}
#fontSizeLabel{font-family:var(--mono);font-size:12px;min-width:38px}
.reader{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.toc{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px;position:sticky;top:73px;max-height:calc(100vh - 110px);overflow-y:auto}
.toc-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);padding:8px 10px 10px}
.toc button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:8px 10px;border-radius:var(--radius-sm);font-size:13px;color:var(--text);line-height:1.45;transition:background var(--transition-fast),color var(--transition-fast)}
.toc button:hover{background:var(--bg-subtle)}
.toc button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.toc .ch-no{display:block;font-size:11px;color:var(--text-muted);margin-bottom:1px}
.toc button.active .ch-no{color:var(--accent)}
.reader .article{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:36px 44px;min-height:400px}

    const keys = path.split('.');
    const lastKey = keys.pop();
    const target = keys.reduce((o, k) => {
      if (o[k] === undefined) o[k] = {};
      return o[k];
    }, state);
    target[lastKey] = val;
  };

  // 数据版本 +1，通知所有组件数据已更新
  const bumpVersion = () => { state.dataVersion++; };

  const reset = () => {
    state.book = null;
    state.chapters = [];
    state.roles = [];
    state.files = {};
    state.settings = [];
    state.graph = { nodes: [], edges: [] };
    state.loading = false;
    state.error = null;
    state.diagnostics = { missingRecommended: [], duplicateRoles: [], legacyCharacterFiles: [], chapterWarnings: [] };
    state.dataVersion = 0;
    state.bookId = null;
  };

  // 检查组件是否需要重绘（数据版本变化时返回 true）
  const needsRender = (componentName, lastVersion) => {
    return state.dataVersion !== lastVersion;
  };

  return { state, get, set, reset, bumpVersion, needsRender };
})();

/* ---------- MDParser Markdown 解析模块（CommonMark 兼容） ==========
   支持的块级语法：段落、标题（ATX h1-h6 / Setext h1-h2）、代码块（缩进 / 围栏）、
   引用（含嵌套）、列表（无序/有序/任务，含嵌套）、表格（GFM 含对齐）、水平线。
   支持的行内语法：强调（** / * / __ / _）、删除线（~~）、代码（`）、链接、图片、
   硬换行（行尾双空格或 \）、自动链接。
   安全：URL 经协议白名单校验；HTML 实体自动转义；原始 HTML 降级为纯文本。
   ==================================================================== */
const MDParser = (() => {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
  const escAttr = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);

  // ---- URL 安全校验 ----
  const ALLOWED_PROTOCOLS = /^(https?:|mailto:|#)/i;
  const BLOCKED_PROTOCOLS = /^(javascript|data|vbscript|file):/i;
  const CONTROL_CHARS = /[\x00-\x1f\x7f\t]/g;

  function sanitizeUrl(raw) {
    if (!raw) return null;
    let url = String(raw).replace(CONTROL_CHARS, '').trim();
    url = url.replace(/^["']+|["']+$/g, '').trim();
    if (!url) return null;
    if (/^\/\//.test(url)) return null;
    url = url.replace(/\\/g, '/');
    url = url.replace(/&#(\d+);/g, (m, d) => String.fromCharCode(d))
             .replace(/&#x([0-9a-f]+);/gi, (m, h) => String.fromCharCode(parseInt(h, 16)));
    url = url.replace(CONTROL_CHARS, '').trim();
    if (!url) return null;
    url = url.replace(/：/g, ':');
    url = url.replace(/\s+/g, '').replace(CONTROL_CHARS, '');
    if (!url) return null;
    if (BLOCKED_PROTOCOLS.test(url)) return null;
    if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(url)) {
      return /^[a-zA-Z0-9_\-./?#&=]+$/.test(url) ? url : null;
    }
    return ALLOWED_PROTOCOLS.test(url) ? url : null;
  }

  // ---- 行内解析（递归下降，正确处理嵌套） ----
  // placeholders 数组在递归调用间共享，确保嵌套占位符可正确恢复
  function parseInline(text, placeholders) {
    if (!text) return '';
    if (!placeholders) placeholders = [];
    const ph = html => { placeholders.push(html); return `\x00${placeholders.length - 1}\x00`; };

    // 1. 行内代码（最高优先级，内容不解析）
    text = text.replace(/`+([^`]+?)`+/g, (m, code) => ph('<code>' + esc(code) + '</code>'));

    // 2. 图片 ![alt](url "title")（必须在链接之前处理）
    text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g, (m, alt, url, title) => {
      const safeUrl = sanitizeUrl(url);
      if (safeUrl == null) return ph(esc(alt));
      const t = title ? ` title="${escAttr(title)}"` : '';
      return ph(`<img src="${escAttr(safeUrl)}" alt="${escAttr(alt)}"${t}>`);
    });

    // 3. 链接 [text](url "title")
    text = text.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g, (m, linkText, url, title) => {
      const safeUrl = sanitizeUrl(url);
      if (safeUrl == null) return ph(esc(linkText));
      const ext = /^https?:/i.test(safeUrl);
      const rel = ext ? ' rel="noopener noreferrer" target="_blank"' : '';
      const t = title ? ` title="${escAttr(title)}"` : '';
      return ph(`<a href="${escAttr(safeUrl)}"${t}${rel}>` + parseInline(linkText, placeholders) + '</a>');
    });

    // 4. 粗斜体 ***text*** / ___text___
    text = text.replace(/\*\*\*((?:[^*]|\*(?!\*))+)\*\*\*/g, (m, t) => ph('<strong><em>' + parseInline(t, placeholders) + '</em></strong>'));
    text = text.replace(/___((?:[^_]|_(?!_))+)_/g, (m, t) => ph('<strong><em>' + parseInline(t, placeholders) + '</em></strong>'));

    // 5. 粗体 **text** / __text__（内容可含单个 * 但不含 **）
    text = text.replace(/\*\*((?:[^*]|\*(?!\*))+)\*\*/g, (m, t) => ph('<strong>' + parseInline(t, placeholders) + '</strong>'));
    text = text.replace(/__((?:[^_]|_(?!_))+?)__/g, (m, t) => ph('<strong>' + parseInline(t, placeholders) + '</strong>'));

    // 6. 斜体 *text* / _text_（内容可含 ** 但不含 ***）
    text = text.replace(/(?<!\*)\*((?:[^*]|\*{1,2}(?!\*))+)\*(?!\*)/g, (m, t) => ph('<em>' + parseInline(t, placeholders) + '</em>'));
    text = text.replace(/(?<!\w)_((?:[^_]|_{1,2}(?!_))+)_(?!\w)/g, (m, t) => ph('<em>' + parseInline(t, placeholders) + '</em>'));

    // 7. 删除线 ~~text~~
    text = text.replace(/~~([^~]+)~~/g, (m, t) => ph('<del>' + parseInline(t, placeholders) + '</del>'));

    // 8. 自动链接 <url>
    text = text.replace(/<([a-zA-Z][a-zA-Z0-9+.-]*:[^>]+)>/g, (m, url) => {
      const safeUrl = sanitizeUrl(url);
      return safeUrl ? ph(`<a href="${escAttr(safeUrl)}" rel="noopener noreferrer" target="_blank">${esc(safeUrl)}</a>`) : ph(esc(m));
    });

    // 9. 转义字符 \_ \* \[ \] \( \) \# \` \~ \{ \} \| \\ \. \!
    text = text.replace(/\\([_*\[\]()#`~|\\.!])/g, (m, ch) => ph(esc(ch)));

    // 10. 剩余文本 HTML 转义
    text = esc(text);

    // 11. 恢复占位符
    return text.replace(/\x00(\d+)\x00/g, (m, idx) => placeholders[parseInt(idx)]);
  }

  // ---- 块级解析 ----
  function parse(src) {
    const lines = src.replace(/\r\n?/g, '\n').split('\n');
    let i = 0;
    const out = [];

    const peek = offset => lines[i + offset] || '';
    const rest = () => lines.slice(i);

    // -- 围栏代码块 --
    function parseFence() {
      const m = lines[i].match(/^(`{3,}|~{3,})(.*)$/);
      if (!m) return false;
      const fence = m[1][0];
      const fenceLen = m[1].length;
      const info = (m[2] || '').trim();
      const code = [];
      i++;
      while (i < lines.length) {
        const line = lines[i];
        const lm = line.match(/^(`{3,}|~{3,})/);
        // 闭合围栏：相同字符、长度 >= 开头、整行只有围栏字符（可有空白）
        if (lm && lm[1][0] === fence && lm[1].length >= fenceLen && line.trim().length === lm[1].length) break;
        code.push(line);
        i++;
      }
      i++; // skip closing fence
      const lang = info ? ` class="lang-${escAttr(info.split(/\s+/)[0])}"` : '';
      out.push('<pre><code' + lang + '>' + esc(code.join('\n')) + '</code></pre>');
      return true;
    }

    // -- ATX 标题 --
    function parseATX() {
      const m = lines[i].match(/^(#{1,6})(?:\s+|\s*$)(.*?)(?:\s+#*)?\s*$/);
      if (!m) return false;
      const level = m[1].length;
      const text = m[2].trim();
      out.push(`<h${level}>${parseInline(text)}</h${level}>`);
      i++;
      return true;
    }

    // -- Setext 标题 --
    function parseSetext() {
      if (i + 1 >= lines.length) return false;
      const t = lines[i].trim();
      if (!t || /^#{1,6}\s/.test(t) || /^[-=]{2,}\s*$/.test(t)) return false;
      const next = lines[i + 1].trim();
      if (/^={2,}\s*$/.test(next)) { out.push(`<h1>${parseInline(t)}</h1>`); i += 2; return true; }
      if (/^-{2,}\s*$/.test(next)) { out.push(`<h2>${parseInline(t)}</h2>`); i += 2; return true; }
      return false;
    }

    // -- 水平线 --
    function parseHR() {
      if (/^(\*{3,}|-{3,}|_{3,})\s*$/.test(lines[i].trim())) { out.push('<hr>'); i++; return true; }
      return false;
    }

    // -- 块引用 --
    function parseBlockquote() {
      if (!lines[i].trim().startsWith('>')) return false;
      const bqLines = [];
      while (i < lines.length) {
        const line = lines[i];
        const trimmed = line.trim();
        if (trimmed === '>') { bqLines.push(''); i++; continue; }
        if (trimmed.startsWith('>')) { bqLines.push(trimmed.replace(/^>\s?/, '')); i++; continue; }
        // 懒惰延续：如果下一行是段落延续（非空且非其他块级元素）
        if (line && line.trim() && !isBlockStart(line) && bqLines.length) {
          bqLines.push(line.trim());
          i++;
          continue;
        }
        break;
      }
      out.push('<blockquote>' + parse(bqLines.join('\n')) + '</blockquote>');
      return true;
    }

    // -- 列表（含嵌套） --
    function parseList() {
      const m = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
      if (!m) return false;
      const startIndent = m[1].length;
      const items = [];

      while (i < lines.length) {
        const line = lines[i];
        const lm = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (!lm) {
          // 懒惰延续或子内容
          if (line.trim() && !isBlockStart(line) && items.length) {
            items[items.length - 1].content.push(line);
            i++;
            continue;
          }
          break;
        }
        const indent = lm[1].length;
        if (indent < startIndent) break; // 缩进减少，退出列表
        if (indent > startIndent) {
          // 嵌套：回退一行，让递归处理
          if (items.length) {
            items[items.length - 1].content.push(line);
            i++;
            continue;
          }
          break;
        }
        // 同级列表项
        const marker = lm[2];
        const content = lm[3];
        // 任务列表检测
        const taskM = content.match(/^\[([ xX])\]\s+(.*)$/);
        const chk = taskM ? taskM[1].toLowerCase() === 'x' : null;
        const txt = taskM ? taskM[2] : content;
        items.push({ marker, chk, content: [txt], task: taskM !== null });
        i++;
      }

      // 渲染列表
      const firstMarker = items[0].marker;
      const isOrdered = /^\d/.test(firstMarker);
      const hasTask = items.some(it => it.task);
      const tag = isOrdered ? 'ol' : 'ul';

      const renderItem = item => {
        // 递归解析列表项内容（支持嵌套列表、段落等）)
        const inner = parse(item.content.join('\n'));
        if (item.task) {
          return '<li class="task-list-item">' +
            '<input type="checkbox" disabled' + (item.chk ? ' checked' : '') + '> ' +
            inner.replace(/^<p>/, '').replace(/<\/p>$/, '') + '</li>';
        }
        return '<li>' + inner.replace(/^<p>/, '').replace(/<\/p>$/, '') + '</li>';
      };

      out.push('<' + tag + (hasTask ? ' class="task-list"' : '') + '>' + items.map(renderItem).join('') + '</' + tag + '>');
      return true;
    }

    // -- 表格（GFM 含对齐） --
    function parseTable() {
      const line = lines[i].trim();
      if (!line.startsWith('|') || !line.endsWith('|')) return false;
      if (i + 1 >= lines.length) return false;
      const hdrCells = splitTableRow(line);
      const sepLine = lines[i + 1].trim();
      const sepCells = splitTableRow(sepLine);
      // 验证分隔行格式
      if (!sepCells.every(c => /^:?-+:?$/.test(c.trim()))) return false;
      if (sepCells.length !== hdrCells.length) return false;

      const aligns = sepCells.map(c => {
        const t = c.trim();
        if (t.startsWith(':') && t.endsWith(':')) return 'center';
        if (t.endsWith(':')) return 'right';
        return '';
      });

      const hdrHtml = hdrCells.map((c, i) => {
        const a = aligns[i] ? ` style="text-align:${aligns[i]}"` : '';
        return '<th' + a + '>' + parseInline(c.trim()) + '</th>';
      }).join('');

      let r = i + 2;
      const rows = [];
      while (r < lines.length) {
        const rowLine = lines[r].trim();
        if (!rowLine.startsWith('|') || !rowLine.endsWith('|')) break;
        const cells = splitTableRow(rowLine);
        // 补齐/截断列数
        while (cells.length < hdrCells.length) cells.push('');
        if (cells.length > hdrCells.length) cells.length = hdrCells.length;
        rows.push(cells);
        r++;
      }

      const rowsHtml = rows.map(cells =>
        '<tr>' + cells.map((c, idx) => {
          const a = aligns[idx] ? ` style="text-align:${aligns[idx]}"` : '';
          return '<td' + a + '>' + (c.trim() ? parseInline(c.trim()) : '') + '</td>';
        }).join('') + '</tr>'
      ).join('');

      out.push('<table><thead><tr>' + hdrHtml + '</tr></thead><tbody>' + rowsHtml + '</tbody></table>');
      i = r;
      return true;
    }

    // -- 分割表格行（支持转义管道符） --
    function splitTableRow(row) {
      const trimmed = row.replace(/^\s*\|\s*/, '').replace(/\s*\|\s*$/, '');
      const cells = [];
      let cur = '', inCode = false;
      for (let j = 0; j < trimmed.length; j++) {
        const ch = trimmed[j];
        if (ch === '`') { inCode = !inCode; cur += ch; }
        else if (ch === '\\' && trimmed[j + 1] === '|') { cur += '|'; j++; }
        else if (ch === '|' && !inCode) { cells.push(cur.trim()); cur = ''; }
        else { cur += ch; }
      }
      cells.push(cur.trim());
      return cells;
    }

    // -- 缩进代码块 --
    function parseIndentedCode() {
      if (!lines[i].startsWith('    ') || lines[i].trim() === '') return false;
      const code = [];
      while (i < lines.length && (lines[i].startsWith('    ') || lines[i].trim() === '')) {
        code.push(lines[i].startsWith('    ') ? lines[i].slice(4) : '');
        i++;
      }
      out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>');
      return true;
    }

    // -- 判断某行是否是块级元素开始 --
    function isBlockStart(line) {
      const t = line.trim();
      if (!t) return true;
      if (/^(```|~~~)/.test(t)) return true;
      if (/^#{1,6}\s/.test(t)) return true;
      if (/^(\*{3,}|-{3,}|_{3,})\s*$/.test(t)) return true;
      if (t.startsWith('>')) return true;
      if (/^(\s*)([-*+]|\d+[.)])\s+/.test(line)) return true;
      if (t.startsWith('|') && t.endsWith('|')) return true;
      return false;
    }

    // -- 段落（收集连续非空行，处理硬换行） --
    function parseParagraph() {
      const pLines = [];
      while (i < lines.length) {
        const line = lines[i];
        if (line.trim() === '') break;
        if (isBlockStart(line) && pLines.length) break;
        pLines.push(line);
        i++;
      }
      if (!pLines.length) return false;

      // 段落内：软换行用空格连接，硬换行（行尾双空格或 \）生成 <br>
      const segments = [];
      let current = '';
      for (let k = 0; k < pLines.length; k++) {
        const pl = pLines[k];
        const isLast = k === pLines.length - 1;
        const hardBreak = !isLast && (/ {2,}$/.test(pl) || /\\$/.test(pl));
        const text = hardBreak ? pl.replace(/(\\{1,}| {2,})$/, '') : pl;
        if (hardBreak) {
          current += text;
          segments.push(current);
          current = '';
        } else if (!isLast) {
          current += text + ' ';
        } else {
          current += text;
        }
      }
      if (current) segments.push(current);

      const html = segments.map(s => parseInline(s)).join('<br>\n');
      out.push('<p>' + html + '</p>');
      return true;
    }

    // -- 主循环 --
    while (i < lines.length) {
      const line = lines[i];
      if (line.trim() === '') { i++; continue; }

      if (parseFence()) continue;
      if (parseATX()) continue;
      if (parseSetext()) continue;
      if (parseHR()) continue;
      if (parseBlockquote()) continue;
      if (parseList()) continue;
      if (parseTable()) continue;
      if (parseIndentedCode()) continue;
      if (parseParagraph()) continue;

      // 兜底：跳过无法识别的行
      i++;
    }

    return out.join('\n');
  }

  // 提取某个标题下的内容
  const extractSection = (text, re) => {
    if (!text) return [];
    const m = text.match(new RegExp(`##?\\s*[^\\n]*(?:${re})[\\s\\S]*?(?=\\n##?\\s|$)`, 'i'));
    if (!m) return [];
    return m[0].replace(/^#+\s*.*\n/, '').trim().split('\n').map(l => l.replace(/^[-*]\s*/, '').trim()).filter(Boolean);
  };

  // 从列表式字段中提取标签值
  const extractField = (text, labels) => {
    if (!text) return '';
    const labelList = (Array.isArray(labels) ? labels : [labels]).map(s => String(s).toLowerCase());
    for (const raw of text.split('\n')) {
      const m = raw.match(/^\s*[-*]\s*\*\*\s*([^*]+?)\s*\*\*\s*[：:]\s*(.*)$/);
      if (!m) continue;
      const tag = m[1].trim().toLowerCase();
      if (labelList.some(l => tag === l || tag.includes(l) || l.includes(tag))) return m[2].trim();
    }
    return '';
  };

  return { parse, parseInline, extractSection, extractField };
})();

// 剥离 Markdown 语法，输出纯正文（供 TXT 导出用）
function stripMarkdown(text) {
  if (!text) return '';
  return text
    .replace(/```[\s\S]*?```/g, '')      // 代码块
    .replace(/`([^`]+)`/g, '$1')         // 行内代码
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1') // 链接 → 文本
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '') // 图片
    .replace(/~~([^~]+)~~/g, '$1')       // 删除线
    .replace(/(\*\*|__)(.+?)\1/g, '$2')  // 粗体
    .replace(/(\*|_)(.+?)\1/g, '$2')     // 斜体
    .replace(/^#+\s*/gm, '')              // 标题标记
    .replace(/^\s*[-*+]\s*/gm, '')        // 列表标记
    .replace(/^\s*\d+\.\s*/gm, '')        // 有序列表
    .replace(/^>\s?/gm, '')              // 引用
    .replace(/^\|.*\|$/gm, '')           // 表格行
    .replace(/[-*_]{3,}/g, '')           // 水平线
    .replace(/\n{3,}/g, '\n\n')          // 多余空行
    .trim();
}

/* ---------- Router 路由模块 ---------- */
const Router = (() => {
  let current = null; // 初始为 null，确保首次 switchTab 必定触发 onEnter
  const componentMap = {};

  const register = (name, component) => {
    componentMap[name] = component;
  };

  const switchTab = (tab, options) => {
    const force = options && options.force;
    // 防止重复切换（force=true 时强制重新进入，用于数据刷新后）
    if (tab === current && !force) return;

    // force 刷新同一组件时：避免"旧组件 onLeave → 新组件 onEnter"竞态，
    // 改为直接调用 onReload（若组件提供），跳过 destroy/restart 周期
    if (tab === current && force) {
      const comp = componentMap[current];
      if (comp && comp.onReload) {
        comp.onReload();
      } else if (comp && comp.onEnter) {
        // 无 onReload 时退化为 onEnter（此时 GraphEngine 已做空值保护）
        comp.onEnter();
      }
      location.hash = tab;
      PageToc.refresh();
      return;
    }

    // 调用旧组件的 onLeave
    const oldComp = componentMap[current];
    if (oldComp && oldComp.onLeave) oldComp.onLeave();

    // 更新 tab 按钮状态 + tabindex
    document.querySelectorAll('.tabs [role="tab"]').forEach(b => {
      const isActive = b.dataset.tab === tab;
      b.setAttribute('aria-selected', isActive);
      b.classList.toggle('active', isActive);
      b.setAttribute('tabindex', isActive ? '0' : '-1');
    });

    // 更新面板
    document.querySelectorAll('.panel').forEach(p => {
      const isActive = p.id === 'panel-' + tab;
      p.classList.toggle('active', isActive);
      p.hidden = !isActive;
    });

    // 调用新组件的 onEnter
    const newComp = componentMap[tab];
    if (newComp && newComp.onEnter) newComp.onEnter();

    current = tab;
    location.hash = tab;
    PageToc.refresh();
  };

  const init = () => {
    // 读取 URL hash，默认 overview
    const hash = location.hash.replace('#', '');
    if (hash && componentMap[hash]) {
      current = hash;
    } else {
      current = 'overview';
    }

    // 绑定标签按钮
    document.querySelectorAll('.tabs [role="tab"]').forEach(b => {
      b.addEventListener('click', () => switchTab(b.dataset.tab));
    });

    // 监听 hash 变化
    window.addEventListener('hashchange', () => {
      const h = location.hash.replace('#', '');
      if (h && componentMap[h] && h !== current) switchTab(h);
    });

    // 注册快捷键 Ctrl+1~4（全局生效）
    Utils.shortcuts.register('Ctrl+1', () => switchTab('overview'), 'global');
    Utils.shortcuts.register('Ctrl+2', () => switchTab('settings-content'), 'global');
    Utils.shortcuts.register('Ctrl+3', () => switchTab('chars'), 'global');
    Utils.shortcuts.register('Ctrl+4', () => switchTab('read'), 'global');

    // tablist 内键盘导航：左右键在 tablist 中移动焦点（非输入控件场景）
    const tablistEl = document.querySelector('.tabs[role="tablist"]');
    if (tablistEl) {
      tablistEl.addEventListener('keydown', (e) => {
        const tabButtons = [...tablistEl.querySelectorAll('[role="tab"]')];
        const activeIdx = tabButtons.findIndex(b => b.getAttribute('aria-selected') === 'true');
        let nextIdx = activeIdx;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextIdx = (activeIdx + 1) % tabButtons.length;
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') nextIdx = (activeIdx - 1 + tabButtons.length) % tabButtons.length;
        else if (e.key === 'Home') nextIdx = 0;
        else if (e.key === 'End') nextIdx = tabButtons.length - 1;
        else return;
        e.preventDefault();
        const nextTab = tabButtons[nextIdx];
        if (nextTab) { nextTab.click(); nextTab.focus(); }
      });
    }

    // 激活初始面板（force 确保首次必定触发 onEnter）
    switchTab(current, { force: true });
  };

  return { register, switchTab, init, get current() { return current; }, _componentMap: componentMap };
})();

/* ---------- PageToc 右侧标题目录模块 ----------
   从当前激活面板收集标题（h2 / .section-title / 设定文件卡片），
   生成右侧目录；滚动时高亮当前小节，点击平滑滚动定位。 */
const PageToc = (() => {
  let items = [];    // [{ el, text }]
  let linkEls = [];  // 目录按钮
  let seq = 0;
  let ticking = false;
  let bound = false;

  const container = () => document.getElementById('pageToc');

  const ensureId = (el) => {
    if (!el.id) el.id = 'ptoc-' + (++seq);
    return el.id;
  };

  // 收集当前面板的锚点：面板标题 + 小节标题 + 设定文件卡片
  const collect = () => {
    const panel = document.querySelector('.panel.active');
    if (!panel) return [];
    const out = [];
    const h2 = panel.querySelector('h2');
    if (h2) out.push({ el: h2, text: h2.textContent.trim() });
    panel.querySelectorAll('.section-title').forEach(el => {
      const t = el.textContent.trim();
      if (t) out.push({ el, text: t });
    });
    panel.querySelectorAll('.settingfile .name').forEach(el => {
      const card = el.closest('.settingfile');
      const t = el.textContent.trim();
      if (card && t) out.push({ el: card, text: t });
    });
    return out;
  };

  const render = () => {
    const c = container();
    if (!c) return;
    items = collect();
    // 少于 2 个锚点（如阅读面板）不显示目录
    if (items.length < 2) { c.innerHTML = ''; linkEls = []; return; }
    c.innerHTML = '<div class="ptoc-title">本页目录</div>' + items.map((it, i) =>
      `<button type="button" class="ptoc-item" data-i="${i}">${Utils.escHtml(it.text)}</button>`).join('');
    linkEls = [...c.querySelectorAll('.ptoc-item')];
  };

  // 滚动跟随：最后一个越过视口顶部的锚点视为当前小节
  const spy = () => {
    if (!items.length || !linkEls.length) return;
    const OFFSET = 90; // appbar 高度 + 余量
    let activeIdx = 0;
    for (let i = 0; i < items.length; i++) {
      if (items[i].el.getBoundingClientRect().top <= OFFSET) activeIdx = i;
      else break;
    }
    // 滚到页面底部时激活最后一项
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) {
      activeIdx = items.length - 1;
    }
    linkEls.forEach((b, i) => b.classList.toggle('active', i === activeIdx));
  };

  const onScroll = () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; spy(); });
  };

  const bind = () => {
    if (bound) return;
    bound = true;
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    container().addEventListener('click', (e) => {
      const b = e.target.closest('.ptoc-item');
      if (!b) return;
      const it = items[parseInt(b.dataset.i, 10)];
      if (!it) return;
      // 目标处于折叠的设定文件卡片时，先展开再定位
      if (it.el.classList && it.el.classList.contains('settingfile') && !it.el.classList.contains('open')) {
        it.el.classList.add('open');
        const row = it.el.querySelector('.row');
        if (row) row.setAttribute('aria-expanded', 'true');
      }
      it.el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      linkEls.forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    });
  };

  // 面板切换或重渲染后调用：重建目录并刷新高亮
  const refresh = () => {
    bind();
    render();
    spy();
  };

  return { refresh };
})();

/* ---------- Appearance 外观模块 ----------
   管理主题色方案（data-scheme）与自定义背景层（#bgLayer），
   偏好持久化到 localStorage；自定义图片压缩后以 dataURL 存储。 */
const Appearance = (() => {
  const K = { scheme: 'dw-scheme', bg: 'dw-bg', img: 'dw-bg-image', opacity: 'dw-bg-opacity' };
  const SCHEMES = ['indigo', 'ocean', 'forest', 'sunset', 'rose', 'violet'];
  const BGS = ['none', 'dots', 'grid', 'glow', 'image'];
  let scheme = 'indigo', bg = 'none', opacity = 35;

  const $id = id => document.getElementById(id);

  const save = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

  // 应用背景层状态
  const applyBg = () => {
    const layer = $id('bgLayer');
    if (!layer) return;
    layer.className = '';
    layer.style.backgroundImage = '';
    if (bg === 'none') { layer.style.opacity = '0'; return; }
    if (bg === 'image') {
      const url = (() => { try { return localStorage.getItem(K.img); } catch { return null; } })();
      if (!url) { layer.style.opacity = '0'; return; } // 选了图片但没上传过：保持无背景
      layer.classList.add('pat-image');
      layer.style.backgroundImage = 'url("' + url + '")';
      layer.style.opacity = String(opacity / 100);
      return;
    }
    layer.classList.add('pat-' + bg);
    layer.style.opacity = '1';
  };

  // 应用主题色
  const applyScheme = () => {
    const root = document.documentElement;
    if (scheme === 'indigo') root.removeAttribute('data-scheme');
    else root.setAttribute('data-scheme', scheme);
    Utils.theme.refresh();   // accent 等变量缓存随方案更新
    GraphEngine.redraw();    // 关系图按新配色重绘
  };

  // 同步面板中控件的选中态
  const syncUI = () => {
    document.querySelectorAll('#apModeSeg button').forEach(b =>
      b.classList.toggle('active', b.dataset.mode === Utils.theme.current));
    document.querySelectorAll('#apSchemes .ap-swatch').forEach(b =>
      b.classList.toggle('active', b.dataset.scheme === scheme));
    document.querySelectorAll('#apBgSeg button').forEach(b =>
      b.classList.toggle('active', b.dataset.bg === bg));
    $id('apImageTools').hidden = bg !== 'image';
    const hasImg = (() => { try { return !!localStorage.getItem(K.img); } catch { return false; } })();
    $id('apClearImage').disabled = !hasImg;
    $id('apOpacity').value = opacity;
    $id('apOpacityVal').textContent = opacity + '%';
  };

  const setScheme = (s) => {
    if (!SCHEMES.includes(s)) return;
    scheme = s; save(K.scheme, s);
    applyScheme(); syncUI();
  };

  const setBg = (b) => {
    if (!BGS.includes(b)) return;
    bg = b; save(K.bg, b);
    applyBg(); syncUI();
  };

  const setOpacity = (v) => {
    opacity = Math.min(100, Math.max(10, parseInt(v, 10) || 35));
    save(K.opacity, String(opacity));
    applyBg(); syncUI();
  };

  // 图片压缩：最长边 1600，JPEG 0.82，控制 localStorage 占用
  const handleImageFile = (file) => {
    if (!file || !/^image\//.test(file.type)) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1600;
        const scale = Math.min(1, MAX / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(img.width * scale));
        cv.height = Math.max(1, Math.round(img.height * scale));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        const url = cv.toDataURL('image/jpeg', 0.82);
        try {
          localStorage.setItem(K.img, url);
        } catch (e) {
          alert('图片体积过大，无法保存。请换一张分辨率更小的图片。');
          return;
        }
        applyBg(); syncUI();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };

  const init = () => {
    // 恢复偏好
    try {
      scheme = SCHEMES.includes(localStorage.getItem(K.scheme)) ? localStorage.getItem(K.scheme) : 'indigo';
      bg = BGS.includes(localStorage.getItem(K.bg)) ? localStorage.getItem(K.bg) : 'none';
      opacity = parseInt(localStorage.getItem(K.opacity), 10) || 35;
    } catch {}

    applyScheme();
    applyBg();

    const btn = $id('appearanceBtn'), panel = $id('appearancePanel');
    const closePanel = () => { panel.hidden = true; btn.setAttribute('aria-expanded', 'false'); };
    const openPanel = () => { syncUI(); panel.hidden = false; btn.setAttribute('aria-expanded', 'true'); };

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      panel.hidden ? openPanel() : closePanel();
    });
    panel.addEventListener('click', (e) => e.stopPropagation());
    document.addEventListener('click', closePanel);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !panel.hidden) closePanel(); });

    $id('apModeSeg').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-mode]');
      if (!b) return;
      Utils.theme.set(b.dataset.mode);
      // 同步顶栏 🌙 按钮的图标与 aria-label（与 initApp 中逻辑一致）
      const themeBtn = $id('themeBtn');
      const m = Utils.theme.current;
      const label = m === 'dark' ? '深色' : m === 'light' ? '浅色' : '自动';
      themeBtn.textContent = m === 'dark' ? '☀' : m === 'light' ? '🌙' : '🌓';
      themeBtn.setAttribute('aria-label', `当前主题：${label}，点击切换`);
      GraphEngine.redraw();
      syncUI();
    });
    $id('apSchemes').addEventListener('click', (e) => {
      const b = e.target.closest('.ap-swatch');
      if (b) setScheme(b.dataset.scheme);
    });
    $id('apBgSeg').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-bg]');
      if (b) setBg(b.dataset.bg);
    });
    $id('apPickImage').addEventListener('click', () => $id('apImageInput').click());
    $id('apImageInput').addEventListener('change', (e) => {
      if (e.target.files.length) handleImageFile(e.target.files[0]);
      e.target.value = ''; // 允许重复选择同一文件
    });
    $id('apClearImage').addEventListener('click', () => {
      try { localStorage.removeItem(K.img); } catch {}
      applyBg(); syncUI();
    });
    $id('apOpacity').addEventListener('input', (e) => setOpacity(e.target.value));

    syncUI();
  };

  return { init, syncMode: syncUI };
})();

/* ---------- 通用工具 ---------- */
const $ = id => document.getElementById(id);

/* ---------- 读取书源文件夹（handle 模式 / entries 模式） ---------- */
async function readTextFromHandle(handle, path) {
  const parts = path.split("/");
  let dir = handle;
  try {
    for (let i = 0; i < parts.length - 1; i++) {
      if (!parts[i]) continue;
      dir = await dir.getDirectoryHandle(parts[i]);
    }
    const fh = await dir.getFileHandle(parts[parts.length - 1]);
    return await (await fh.getFile()).text();
  } catch { return null; }
}
// 从 entries 中确定唯一根目录前缀（所有 webkitRelativePath 的公共前缀）
function determineRootPrefix(entries) {
  const paths = entries.map(e => e.webkitRelativePath || e.relativePath || e.fullPath).filter(Boolean);
  if (paths.length === 0) return '';
  // 取第一个路径，逐级缩短，找到所有路径都以它为前缀的最长段
  const first = paths[0];
  const segments = first.split('/');
  for (let len = segments.length; len > 0; len--) {
    const prefix = segments.slice(0, len).join('/');
    if (paths.every(p => p === prefix || p.startsWith(prefix + '/'))) {
      return prefix;
    }
  }
  return '';
}

// 缓存本次会话的根目录前缀：按 entries 数组本身弱引用，避免跨目录复用错误前缀
const rootPrefixCache = new WeakMap();

function getRootPrefix(entries) {
  if (!entries || !entries.length) return '';
  let prefix = rootPrefixCache.get(entries);
  if (prefix === undefined) {
    prefix = determineRootPrefix(entries);
    rootPrefixCache.set(entries, prefix);
  }
  return prefix;
}


// 标准化相对路径：去掉根目录前缀，得到相对于书根目录的路径
function toRelPath(entry, rootPrefix) {
  const full = entry.webkitRelativePath || entry.relativePath || e_fullPath(entry);
  if (rootPrefix && full.startsWith(rootPrefix + '/')) {
    return full.slice(rootPrefix.length + 1);
  }
  return full;
}

// 兼容某些环境下 fullPath 以 / 开头
function e_fullPath(e) {
  return e.fullPath ? (e.fullPath.startsWith('/') ? e.fullPath.slice(1) : e.fullPath) : '';
}

// 精确匹配：标准化后的相对路径 === 期望路径（禁止 endsWith 模糊匹配）
async function readTextFromEntries(entries, relPath) {
  const rootPrefix = getRootPrefix(entries);
  const f = entries.find(e => toRelPath(e, rootPrefix) === relPath);
  return f ? await f.text() : null;
}

// 排除快照、备份、rewrite 等非权威目录
const EXCLUDED_DIRS = /^(snapshots|runtime|rewrite|rewrites|backup|backups|快照|备份)(\/|$)/i;

function isExcludedPath(relPath) {
  const segments = relPath.split('/');
  return segments.some(seg => EXCLUDED_DIRS.test(seg));
}

async function collectRoles(handle, entries) {
  const roles = [];
  if (handle) {
    // handle 模式：直接进入 story/roles，不递归整本书（防快照/备份污染）
    const ROLE_RE = /(?:major|minor|主要角色|次要角色)\/(.+?\.(?:md|MD))$/;
    async function walkDir(dir, prefix) {
      for await (const [name, h] of dir.entries()) {
        const path = prefix + "/" + name;
        if (h.kind === "file" && name.endsWith(".md")) {
          const m = path.match(ROLE_RE);
          if (m) {
            const tier = /次要|minor/.test(path) ? "次要角色" : "主要角色";
            let text = "";
            try { text = await (await h.getFile()).text(); } catch {}
            roles.push({ tier, name: m[1].replace(/\.md$/i, ""), text });
          }
        } else if (h.kind === "directory") {
          try { await walkDir(h, path); } catch {}
        }
      }
    }
    try {
      const story = await handle.getDirectoryHandle("story");
      const rolesDir = await story.getDirectoryHandle("roles");
      await walkDir(rolesDir, "roles");
    } catch {}
  } else if (entries) {
    const rootPrefix = getRootPrefix(entries);
    for (const e of entries) {
      const rel = toRelPath(e, rootPrefix);
      if (isExcludedPath(rel)) continue;
      // 只匹配根目录下 story/roles/ 中的角色文件
      const m = rel.match(/^story\/roles\/(?:major|minor|主要角色|次要角色)\/(.+?\.(?:md|MD))$/);
      if (m) {
        const tier = /次要|minor/.test(rel) ? "次要角色" : "主要角色";
        roles.push({ tier, name: m[1].replace(/\.md$/i, ""), text: await e.text() });
      }
    }
  }
  // 检测旧版单文件多角色格式，给出明确提示
  const legacy = [];
  if (handle) {
    for (const n of ["character_matrix.md", "characters.md"]) {
      if (await readTextFromHandle(handle, "story/" + n)) legacy.push(n);
    }
  } else if (entries) {
    const rootPrefix = getRootPrefix(entries);
    for (const e of entries) {
      const rel = toRelPath(e, rootPrefix);
      if (rel === "story/character_matrix.md" || rel === "story/characters.md") legacy.push(rel.split("/").pop());
    }
  }
  if (legacy.length) {
    Store.set('legacyCharacterFiles', legacy);
    console.warn("[dashboard] 检测到旧角色文件格式：" + legacy.join("、") + "。暂不支持，请迁移到 story/roles/{major|minor}/{name}.md。");
  }

  const seen = new Set();
  const dupSources = new Set();
  const deduped = [];
  for (const r of roles) {
    const k = r.tier + "|" + r.name;
    if (seen.has(k)) { dupSources.add(r.name); continue; }
    seen.add(k);
    deduped.push(r);
  }
  if (dupSources.size) {
    console.warn("[dashboard] 重复角色（保留首份）：" + [...dupSources].join("、"));
    Store.set('duplicateRoles', [...dupSources]);
  }
  return deduped;
}

// 章节来源策略：完全以章节文件为准（chapters/*.md），不读取 chapters/index.json。
// index.json 仅用于其他工具。排除草稿、rewrite、隐藏文件和非 Markdown 文件。
async function collectChapters(handle, entries) {
  const out = [];
  let files = [];
  if (handle) {
    try {
      const dh = await handle.getDirectoryHandle("chapters");
      for await (const [n, h] of dh.entries()) { if (n.endsWith(".md") && h.kind === "file") files.push({ n, t: await (await h.getFile()).text() }); }
    } catch {}
  } else if (entries) {
    const rootPrefix = getRootPrefix(entries);
    for (const e of entries) {
      const rel = toRelPath(e, rootPrefix);
      if (isExcludedPath(rel)) continue;
      // 只匹配根目录下 chapters/ 中的章节文件
      if (/^chapters\/.+\.(md|MD)$/.test(rel)) {
        files.push({ n: rel.split("/").pop(), _t: e.text() });
      }
    }
  }
  for (const f of files.sort((a, b) => chapterSortKey(a.n).localeCompare(chapterSortKey(b.n)))) {
    const text = f.t || await f._t;
    const num = parseChapterNum(f.n);
    const title = f.n.replace(/^\d+[_\-]?/, "").replace(/\.md$/i, "").trim();
    out.push({ name: f.n, num, title, text });
  }
  return out;
}

// 解析章号：优先从文件名提取数字章号，用于排序
function parseChapterNum(name) {
  const m = name.match(/^(\d+)/);
  return m ? parseInt(m[1], 10) : 0;
}

// 排序键：按解析后的章号数值排序，同章号再按原名字典序（覆盖非补零旧文件）
function chapterSortKey(name) {
  const num = parseChapterNum(name);
  return String(num).padStart(8, '0') + '_' + name;
}

async function listTopLevel(handle, entries) {
  try {
    if (handle) {
      const names = [];
      for await (const [name] of handle.entries()) names.push(name);
      return names.slice(0, 20).join("、");
    } else if (entries) {
      const seen = new Set();
      for (const e of entries) { const rel = e.webkitRelativePath || e.relativePath || e.fullPath; const top = rel.split("/")[0]; if (!seen.has(top)) seen.add(top); }
      return [...seen].slice(0, 20).join("、");
    }
  } catch {}
  return "（无法读取）";
}

async function validateBookDir(handle, entries) {
  const missing = [];
  let bookJson = null;
  try {
    bookJson = handle ? await readTextFromHandle(handle, "book.json") : await readTextFromEntries(entries, "book.json");
  } catch {}
  if (bookJson == null) missing.push("book.json");
  let hasChapters = false;
  let chapterCount = 0;
  try {
    if (handle) {
      const dh = await handle.getDirectoryHandle("chapters");
      hasChapters = !!dh;
      // handle 模式：统计权威章节文件数（排除快照/备份等）
      if (dh) {
        for await (const [n, h] of dh.entries()) {
          if (n.endsWith(".md") && h.kind === "file" && !isExcludedPath("chapters/" + n)) chapterCount++;
        }
      }
    } else if (entries) {
      // entries 模式：使用标准化路径 + 排除目录规则，只接受根目录下 chapters/*.md
      const rootPrefix = getRootPrefix(entries);
      for (const e of entries) {
        const rel = toRelPath(e, rootPrefix);
        if (isExcludedPath(rel)) continue;
        if (/^chapters\/[^/]+\.(md|MD)$/.test(rel)) { hasChapters = true; chapterCount++; }
      }
    }
  } catch { hasChapters = false; }
  if (!hasChapters) missing.push("chapters/");
  // 空 chapters 目录：新书合法（不阻断），但记录到返回信息中
  return { missing, chapterCount };
}

// 集中式别名映射。权威来源：references/file-contract.json → aliases 字段。
// 本对象由构建脚本从契约内联生成（build_dashboard.py --inline-contract），不要手动双向编辑。
// 契约中还定义了 requiredFiles / recommendedFiles / excludedPaths / characterLegacyFiles。
const ALIASES = {
  'story/outline/story_frame.md': ['story/story_bible.md', 'story/setting.md', 'story/world.md'],
  'story/outline/volume_map.md': ['story/volume_outline.md', 'story/outline.md', 'story/plot.md'],
  'story/book_rules.md': ['story/rules.md', 'story/writing_rules.md'],
  'story/author_intent.md': ['story/author.md', 'story/intent.md'],
  'story/current_focus.md': ['story/focus.md', 'story/next.md'],
  'story/current_state.md': ['story/state.md', 'story/truth.md'],
  'story/pending_hooks.md': ['story/hooks.md', 'story/foreshadowing.md'],
  'story/chapter_summaries.md': ['story/summaries.md'],
  'story/audit-drift.md': ['story/audit_drift.md'],
  'story/style_guide.md': ['story/style.md', 'story/writing_style.md'],
};

// 反向映射：从旧名/别名 → canonical path（用于兼容模式精确匹配时识别）
const ALIAS_TO_CANONICAL = (() => {
  const map = {};
  for (const [canonical, aliases] of Object.entries(ALIASES)) {
    map[canonical.toLowerCase()] = canonical;
    for (const alias of aliases) map[alias.toLowerCase()] = canonical;
  }
  return map;
})();

// JSON 解析错误应报告具体文件和原因
function parseBookJson(text) {
  try {
    return JSON.parse(text.replace(/^﻿/, ""));
  } catch (e) {
    throw new Error("book.json 解析失败：" + e.message + "。请检查文件是否为合法 JSON。");
  }
}

// 带别名回退的读取：先尝试标准路径，失败则依次尝试别名（F7）
async function readWithAlias(handle, entries, path) {
  const primary = handle ? await readTextFromHandle(handle, path) : await readTextFromEntries(entries, path);
  if (primary != null) return primary;
  const aliases = ALIASES[path];
  if (aliases) {
    for (const alias of aliases) {
      const fallback = handle ? await readTextFromHandle(handle, alias) : await readTextFromEntries(entries, alias);
      if (fallback != null) return fallback;
    }
  }
  return null;
}

async function loadBook(handle, entries) {
  const { missing, chapterCount } = await validateBookDir(handle, entries);
  if (missing.length) {
    const got = await listTopLevel(handle, entries);
    throw new Error(
      "在所选目录中未找到：" + missing.join("、") + "。\n" +
      "该目录内容为：" + got + "\n\n" +
      "请选择书的根目录（即含 book.json、chapters/、story/ 的那一层）。"
    );
  }
  const read = (p) => readWithAlias(handle, entries, p);
  const [bjs, sf, vm, br, cs, summ, style, drift, focus] = await Promise.all([
    read("book.json"), read("story/outline/story_frame.md"), read("story/outline/volume_map.md"),
    read("story/book_rules.md"), read("story/current_state.md"), read("story/chapter_summaries.md"),
    read("story/style_guide.md"), read("story/audit-drift.md"), read("story/current_focus.md")
  ]);
  const files = { story_frame: sf, volume_map: vm, book_rules: br, current_state: cs, chapter_summaries: summ, style_guide: style, audit_drift: drift, current_focus: focus };

  // 非阻断缺失文件诊断：区分 required（已在 validateBookDir 阻断）与 recommended
  const RECOMMENDED_FILES = {
    story_frame: 'story/outline/story_frame.md', volume_map: 'story/outline/volume_map.md',
    book_rules: 'story/book_rules.md', current_state: 'story/current_state.md',
    chapter_summaries: 'story/chapter_summaries.md', style_guide: 'story/style_guide.md',
    audit_drift: 'story/audit-drift.md', current_focus: 'story/current_focus.md',
  };
  const missingRecommended = Object.entries(RECOMMENDED_FILES)
    .filter(([k]) => !files[k])
    .map(([k, label]) => ({ key: k, label }));

  // 章节诊断：重复章号、无效文件名、不连续章号
  const chapters = await collectChapters(handle, entries);
  const chapterWarnings = diagnoseChapters(chapters);

  const result = {
    book: bjs ? parseBookJson(bjs) : {},
    chapters,
    roles: await collectRoles(handle, entries),
    files,
    diagnostics: { missingRecommended, duplicateRoles: [], legacyCharacterFiles: [], chapterWarnings },
  };
  try { if (handle) await idbSave("last", handle); } catch {}
  return result;
}

// 章节诊断：重复章号、无效文件名、不连续章号
function diagnoseChapters(chapters) {
  const warnings = [];
  const numCounts = new Map();
  for (const c of chapters) {
    if (c.num > 0) {
      numCounts.set(c.num, (numCounts.get(c.num) || 0) + 1);
    } else {
      warnings.push({ type: 'invalidNumber', file: c.name, message: `文件名 "${c.name}" 无法解析章号，显示为目录序号` });
    }
  }
  for (const [num, count] of numCounts) {
    if (count > 1) warnings.push({ type: 'duplicateNumber', num, message: `章号 ${num} 出现 ${count} 次` });
  }
  const nums = [...numCounts.keys()].sort((a, b) => a - b);
  for (let i = 1; i < nums.length; i++) {
    if (nums[i] - nums[i - 1] > 1) {
      warnings.push({ type: 'nonContiguous', from: nums[i - 1], to: nums[i], message: `章号不连续：第 ${nums[i - 1]} 章 → 第 ${nums[i]} 章` });
    }
  }
  return warnings;
}

/* ---------- IndexedDB：记住上次选中的文件夹句柄 ---------- */
const IDB = (() => {
  let db = null;
  function open() { return new Promise((res, rej) => {
    try { const r = indexedDB.open("dragon-writer-dashboard", 1); r.onupgradeneeded = e => e.target.result.createObjectStore("handles"); r.onsuccess = e => { db = e.target.result; res(db); }; r.onerror = () => rej(); }
    catch (e) { rej(e); } });
  }
  async function save(name, handle) {
    if (!db) await open(); return new Promise((res, rej) => {
      try { const t = db.transaction("handles", "readwrite"); t.objectStore("handles").put(handle, name); t.oncomplete = () => res(); t.onerror = () => rej(); }
      catch (e) { rej(e); } });
  }
  function load(name) { return new Promise((res, rej) => {
    if (!db) return open().then(() => load(name)).then(res).catch(rej);
    try { const t = db.transaction("handles", "readonly"); const q = t.objectStore("handles").get(name); q.onsuccess = () => res(q.result); q.onerror = () => rej(); }
    catch (e) { rej(e); } });
  }
  return { save, load };
})();
const idbSave = IDB.save;

    const section = (title) => {
      const m = text.match(new RegExp(`## ${title}([\\s\\S]*?)(?=\\n## |$)`, 'i'));
      if (!m || !m[1].trim()) return '';

    const renderDriftSection = (title, body, cls) => {
      const items = body.split(/\n###\s+/).filter(Boolean);
      return `<div class="drift-section"><div class="drift-title ${cls}">${title}</div>` +

          const li = it.split('\n').filter(l => l.trim());
          const head = li.shift() || '';
          return `<div class="drift-item ${cls}"><b>${Utils.escHtml(head.trim().replace(/^第\d+章 · /, ''))}</b>` +
            li.map(l => `<div class="muted">${Utils.escHtml(l.replace(/^-\s*/, '').trim())}</div>`).join('') +
            `</div>`;
        }).join('') + `</div>`;
    };
    const fixed = section('已修复');
    const open = section('已知漂移');
    let out = '';
    if (fixed) out += renderDriftSection('已修复', fixed, 'is-fixed');
    if (open) out += renderDriftSection('已知漂移', open, 'is-open');
    return out || `<div class="article">${MDParser.parse(text)}</div>`;
  },

  _renderWordTrend(chapters) {
    if (!chapters.length) return '<div class="empty-state">暂无章节数据</div>';
    const height = 120;
    const accent = Utils.theme.get('accent');
    const muted = Utils.theme.get('textMuted');
    const targetWords = Store.get('book')?.chapterWordCount || 3000;

    // 大书聚合采样：章节过多时按桶聚合，避免 SVG 节点爆炸
    const MAX_BARS = 200;
    let data = chapters.map(c => ({ num: c.num, words: Utils.countWords(c.text), label: `第${c.num}回` }));
    let aggregated = false;
    if (data.length > MAX_BARS) {
      const bucketSize = Math.ceil(data.length / MAX_BARS);
      const buckets = [];
      for (let i = 0; i < data.length; i += bucketSize) {
        const slice = data.slice(i, i + bucketSize);
        const total = slice.reduce((s, d) => s + d.words, 0);
        buckets.push({ num: slice[0].num, words: Math.round(total / slice.length), label: `第${slice[0].num}–${slice[slice.length - 1].num}回`, aggregated: true });
      }
      data = buckets;
      aggregated = true;
    }

    const maxWords = Math.max(...data.map(d => d.words), 1);
    const gap = 2;
    const barWidth = Math.max(3, Math.min(20, 600 / data.length));
    const width = Math.max(600, data.length * (barWidth + gap));

    const bars = data.map((d, i) => {
      const h = (d.words / maxWords) * (height - 20);
      const x = i * (barWidth + gap);
      const y = height - 10 - h;
      return `<rect x="${x}" y="${y}" width="${barWidth}" height="${h}" fill="${accent}" opacity="0.7" rx="1">
        <title>${d.label}: ${Utils.fmtNum(d.words)} 字${aggregated ? '（均值）' : ''}</title>
      </rect>`;
    }).join('');

    const targetY = height - 10 - (targetWords / maxWords) * (height - 20);
    const targetLine = `<line x1="0" y1="${targetY}" x2="${width}" y2="${targetY}" stroke="${muted}" stroke-dasharray="4,3" stroke-width="1"/>
      <text x="${width - 4}" y="${targetY - 4}" fill="${muted}" font-size="10" text-anchor="end">目标 ${Utils.fmtNum(targetWords)} 字</text>`;

    return `<div style="overflow-x:auto"><svg width="${width}" height="${height + 20}" viewBox="0 0 ${width} ${height + 20}">
      ${bars}${targetLine}
    </svg></div><div class="muted" style="font-size:12px;margin-top:4px">每章字数${aggregated ? `（已按 ${Math.ceil(chapters.length / MAX_BARS)} 章/桶聚合）` : '（鼠标悬停查看具体数值）'}</div>`;
  },
};

/* ---------- 设定完成度计算（纯函数，供 Settings / SettingsContent 共用） ---------- */
const SETTING_DOMAINS = [
  { key: 'story_frame', title: '故事框架 (story_frame.md)', subs: ['主题[与和]基调', '前[台景]故事|背景故事', '核心冲突|对手', '世界[法]?[则律]', '终局[目][标]'] },
  { key: 'volume_map', title: '卷纲 (volume_map.md)', subs: ['弧线[结构]?|[故]?事弧线', '情感曲线', '钩子[种伏]?[子]?|回报图|伏笔', '人[物][角色]?弧线|角色成长', '节奏[原]?[则]?'] },
  { key: 'book_rules', title: '规则书 (book_rules.md)', subs: ['POV|[视][角]', '题材[规]?[则]', '定局锁|硬锁|canon', '力[量]?|限制', '禁[手止]', '风[格]?[约]?束'] },
  { key: 'current_state', title: '当前状态 (current_state.md)', subs: ['[当]?[前]?章节|进度', '地点|时间', '主角', '已知真[相]?|线索', '关系|人际', '资源|伤势|库存', '冲[突]'] },
];

// 纯函数：根据 files 映射计算各领域完成度，不依赖任何组件状态
function computeSettingCompletion(files) {
  return SETTING_DOMAINS.map(d => {
    const text = files[d.key];
    if (!text) return { key: d.key, title: d.title, present: false, pct: 0, items: [] };
    const items = d.subs.map(re => {
      const sec = text.match(new RegExp('##?\\s*[^\\n]*' + re + '[\\s\\S]*?(?=\\n##?\\s|$)', 'i'));
      let filled = false;
      if (sec) {
        const body = sec[0].replace(/^.*\n/, '').trim();
        filled = body.length > 0 && !/^[-\s]*$/.test(body) && !/待[编写定充实]|TODO|xx|请输入|TBD|待补|占位/i.test(body);
      }
      return { label: re.replace(/[\[\]?|]/g, c => ({ '[': '', ']': '', '?': '', '|': ' / ' })[c]), ok: filled };
    });
    const pct = items.length ? Math.round(items.filter(i => i.ok).length / items.length * 100) : 0;
    return { key: d.key, title: d.title, present: true, pct, items };
  });
}
