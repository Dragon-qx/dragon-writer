<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dragon Writer · 写作仪表盘</title>
<style>
/* ========== CSS 变量系统 ========== */
:root {
  --bg: #f6f5f1;
  --bg-elevated: #ffffff;
  --bg-subtle: #efeae1;
  --text: #1c1b18;
  --text-muted: #6b6760;
  --border: #e0dcd4;
  --accent: #b5651d;
  --accent-soft: #f0e4d2;
  --success: #4a7c59;
  --danger: #b53b3b;
  --warning: #c97d2b;
  --track: #e7e3db;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
  --mono: ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
  --serif: "Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --sans: -apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  --font-size-base: 14px;
  --transition-fast: 150ms ease;
  --transition-normal: 200ms ease;
}
@media(prefers-color-scheme:dark) {
  :root.theme-auto {
    --bg: #161513; --bg-elevated: #1f1d1a; --bg-subtle: #26241f;
    --text: #ece7df; --text-muted: #9b9488; --border: #33302a;
    --accent: #d99a4e; --accent-soft: #3a2f1e; --success: #6fae80;
    --track: #2d2a25; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
  }
}
:root.theme-dark {
  --bg: #161513; --bg-elevated: #1f1d1a; --bg-subtle: #26241f;
  --text: #ece7df; --text-muted: #9b9488; --border: #33302a;
  --accent: #d99a4e; --accent-soft: #3a2f1e; --success: #6fae80;
  --track: #2d2a25; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
}
:root.theme-light {
  --bg: #f6f5f1; --bg-elevated: #ffffff; --bg-subtle: #efeae1;
  --text: #1c1b18; --text-muted: #6b6760; --border: #e0dcd4;
  --accent: #b5651d; --accent-soft: #f0e4d2; --success: #4a7c59;
  --track: #e7e3db; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
}

/* ========== Reset ========== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;font-size:var(--font-size-base)}

/* ========== 按钮 ========== */
button{font-family:inherit;cursor:pointer;background:var(--bg-subtle);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 14px;font-size:var(--font-size-base);transition:background var(--transition-fast),border-color var(--transition-fast)}
button:hover{background:var(--border)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{filter:brightness(.95)}
input[type=file]{display:none}
label.filelabel{display:inline-block}

/* ========== 落地页 ========== */
#landing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;text-align:center;padding:24px}
#landing h1{font-family:var(--serif);font-size:30px;margin:0;letter-spacing:.02em}
#landing p{color:var(--text-muted);max-width:460px;margin:0}
#landing .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#landing .hint{font-size:13px;max-width:500px}
#landing code{background:var(--bg-subtle);padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:12px}
#resumeArea{margin-top:12px}
#resumeArea p{margin:6px 0}
#resumeArea .hint{font-size:13px;color:var(--text-muted)}
#recentBooks{display:flex;flex-direction:column;gap:6px;margin-top:8px}

/* ========== Loading ========== */
.loading{display:flex;align-items:center;gap:10px;color:var(--text-muted)}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ========== Layout Grid ========== */
#app{display:none;min-height:100vh}
body.loaded #landing{display:none}
body.loaded #app{display:grid;grid-template-rows:auto 1fr}
.layout{display:grid;grid-template-columns:180px 1fr}

/* ========== Appbar ========== */
.appbar{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--bg-elevated);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.appbar .bookmeta{display:flex;align-items:baseline;gap:10px;min-width:0}
.appbar .booktitle{font-family:var(--serif);font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .booksub{color:var(--text-muted);font-size:13px;white-space:nowrap}
.appbar .spacer{flex:1}
.appbar .badge{background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}

/* ========== Tabs ========== */
.tabs[role="tablist"]{border-right:1px solid var(--border);background:var(--bg-elevated);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:53px;align-self:start;height:calc(100vh - 53px)}
.tabs button[role="tab"]{text-align:left;border:none;background:transparent;border-radius:var(--radius-sm);padding:10px 12px;color:var(--text-muted);font-size:var(--font-size-base);cursor:pointer;transition:background var(--transition-fast),color var(--transition-fast)}
.tabs button[role="tab"]:hover{background:var(--bg-subtle);color:var(--text)}
.tabs button[role="tab"][aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tabs .navlabel{font-size:11px;letter-spacing:.08em;color:var(--text-muted);padding:14px 12px 6px;text-transform:uppercase}

/* ========== Content ========== */
main.content{padding:28px 32px 60px;max-width:1100px;width:100%}
.panel{display:none}
.panel.active{display:block}
.panel h2{font-family:var(--serif);font-size:24px;margin:0 0 4px}
.panel .lede{color:var(--text-muted);margin:0 0 24px}

/* ========== 基本组件 ========== */
.card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.grid{display:grid;gap:16px}
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.empty-state{text-align:center;color:var(--text-muted);padding:40px 20px}
.empty-state .icon{font-size:40px;margin-bottom:12px}
.stat .label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.stat .value{font-family:var(--serif);font-size:26px;font-weight:600;margin-top:4px}
.stat .value small{font-size:14px;color:var(--text-muted);font-weight:400}
.muted{color:var(--text-muted)}
.section-title{font-size:13px;letter-spacing:.06em;color:var(--text-muted);margin:28px 0 12px}
.col2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* ========== Responsive ========== */
@media(max-width:820px) {
  .layout{grid-template-columns:1fr}
  .tabs[role="tablist"]{flex-direction:row;flex-wrap:wrap;height:auto;position:static}
  main.content{padding:20px 16px 60px}
  .col2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ============ 落地页 ============ -->
<div id="landing">
  <h1>🐉 Dragon Writer · 写作仪表盘</h1>
  <p>选择某本书的<b>根目录</b>（即含 <code>book.json</code>、<code>chapters/</code>、<code>story/</code> 的那一层），即可查看当前进度、设定完成度、人物关系与章节阅读。</p>
  <div class="row">
    <button class="primary" id="pickBtn">📖 选择书架文件夹</button>
    <label class="filelabel">
      <input type="file" id="fileInput" webkitdirectory>
      <button type="button" id="compatBtn">📂 兼容模式选择</button>
    </label>
    <button id="refreshBtn" style="display:none">🔄 刷新</button>
  </div>
  <div id="resumeArea" style="display:none">
    <p>上次打开：<span id="resumeName"></span> · <a href="#" id="resumeLink">点此继续</a></p>
    <p class="hint">或者从下方列表选择其他书：</p>
    <div id="recentBooks"></div>
  </div>
  <div id="loadingIndicator" class="loading" style="display:none">
    <div class="spinner"></div>
    <span>正在加载书源文件...</span>
  </div>
</div>

<!-- ============ 应用主体 ============ -->
<div id="app">
  <header class="appbar">
    <div class="bookmeta">
      <span class="booktitle" id="bookTitle">—</span>
      <span class="booksub" id="bookSub"></span>
    </div>
    <span class="badge" id="bookStatus"></span>
    <span class="spacer"></span>
    <button id="rePickBtn" title="切换书架">切换书架</button>
    <button id="themeBtn" title="切换主题">🌙</button>
  </header>
  <div class="layout">
    <nav class="tabs" role="tablist">
      <div class="navlabel">视图</div>
      <button role="tab" aria-selected="true" data-tab="overview">📊 总览</button>
      <button role="tab" aria-selected="false" data-tab="settings">📐 设定完成度</button>
      <button role="tab" aria-selected="false" data-tab="settings-content">📜 设定内容</button>
      <button role="tab" aria-selected="false" data-tab="chars">👥 人物关系</button>
      <button role="tab" aria-selected="false" data-tab="read">📖 阅读章节</button>
    </nav>
    <main class="content">
      <section class="panel active" id="panel-overview" role="tabpanel">
        <h2>总览</h2>
        <p class="lede">本书当前的写作进度与最新状态。</p>
      </section>
      <section class="panel" id="panel-settings" role="tabpanel">
        <h2>设定完成度</h2>
        <p class="lede">基于书源文件中各子章节的填充情况自动计算。展开可逐项查看。</p>
      </section>
      <section class="panel" id="panel-settings-content" role="tabpanel">
        <h2>设定内容</h2>
        <p class="lede">全部设定文件的完整原文，可在仪表盘内直接阅读。</p>
      </section>
      <section class="panel" id="panel-chars" role="tabpanel">
        <h2>人物关系</h2>
        <p class="lede">点击节点查看角色详情。节点颜色区分主要 / 次要角色。</p>
      </section>
      <section class="panel" id="panel-read" role="tabpanel">
        <h2>阅读章节</h2>
        <p class="lede">在仪表盘内直接阅读任意章节。</p>
      </section>
    </main>
  </div>
</div>

<script>
"use strict";
/* ============================================================================
   Dragon Writer 仪表盘 —— 运行时。
   不嵌入任何数据：打开后通过 File System Access API（或 webkitdirectory 回退）
   选择/重连书文件夹，运行时读文件、实时计算并渲染。永远反映最新文件。
   ========================================================================== */

/* ---------- 轻量 Markdown 解析器 ---------- */
const MD = (() => {
  const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const inline = s => s
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/```[\s\S]*?```/g, m => m)
    .replace(/`([^`]+)`/g, (_,c) => `<code>${c}</code>`)
    .replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
    .replace(/(^|[\s])\/([^\/\s][^\/]*?)\/([^\s.,;:!?]|$)/g, '$1<em>$2</em>$3');
  function parseInline(s) { return inline(s || ""); }
  function parse(src) {
    const lines = src.replace(/\r\n?/g,"\n").split("\n");
    let i = 0; const out = []; let pbuf = [];
    const flushP = () => { if (pbuf.length) { out.push("<p>" + pbuf.join(" ").split("  \n").map(s=>inline(s.trim())).join("<br>") + "</p>"); pbuf = []; } };
    const splitRow = r => r.replace(/^\||\|$/g,"").split("|").map(c => c.trim());
    let tbuf = [];
    const flushT = () => {
      if (tbuf.length < 2) { tbuf.forEach(l => out.push("<p>" + inline(l) + "</p>")); tbuf = []; return; }
      const hdr = splitRow(tbuf[0]); const aln = splitRow(tbuf[1]);
      const ok = aln.length && aln.every(c => /^:?-+:?$/.test(c.trim()));
      let h = "<table><thead><tr>"; hdr.forEach(c => h += "<th>" + inline(c.trim()) + "</th>"); h += "</tr></thead><tbody>";
      for (let r = ok ? 2 : 1; r < tbuf.length; r++) { const cells = splitRow(tbuf[r]); h += "<tr>"; cells.forEach(c => h += "<td>" + inline(c.trim()) + "</td>"); h += "</tr>"; }
      h += "</tbody></table>"; out.push(h); tbuf = [];
    };
    while (i < lines.length) {
      const line = lines[i]; const t = line.trim();
      if (/^(```|~~~)/.test(t)) { flushP(); flushT();
        const sym = t.slice(0,3); const code = []; i++;
        while (i < lines.length && !lines[i].trim().startsWith(sym)) { code.push(lines[i]); i++; } i++;
        out.push('<pre><code>' + esc(code.join("\n")) + '</code></pre>'); continue; }
      const hx = t.match(/^(#{1,6})\s+(.+)$/); if (hx) { flushP(); flushT(); out.push(`<h${hx[1].length}>${inline(hx[2])}</h${hx[1].length}>`); i++; continue; }
      if (/^(\*{3,}|-{3,}|_{3,})$/.test(t)) { flushP(); flushT(); out.push("<hr>"); i++; continue; }
      if (t.startsWith(">")) { flushP(); flushT();
        const bq = []; while (i < lines.length && lines[i].trim().startsWith(">")) { bq.push(lines[i].trim().replace(/^>\s?/,"")); i++; }
        out.push("<blockquote>" + parse(bq.join("\n")).replace(/<\/?p>/g,"") + "</blockquote>"); continue; }
      if (t.startsWith("|") && t.endsWith("|")) { flushP(); tbuf.push(t); i++; continue; }
      const task = t.match(/^(\s*)([-*+])\s+\[([ xX])\]\s+(.+)$/); const list = t.match(/^(\s*)([-*+]|\d+\.)\s+(.+)$/);
      if (task || list) { flushP(); flushT();
        const items = []; const re = task ? /^(\s*)([-*+])\s+\[([ xX])\]\s+(.+)$/ : /^(\s*)([-*+]|\d+\.)\s+(.+)$/;
        while (i < lines.length) { const m = lines[i].match(re); if (!m) break;
          items.push(task ? { chk: m[3].toLowerCase() === "x", txt: m[4] } : { chk: null, txt: m[3] }); i++; }
        if (items.some(it => it.chk !== null)) { out.push("<ul>" + items.map(it => `<li>${it.chk ? "✓ ":"○ "}${inline(it.txt)}</li>`).join("") + "</ul>"); }
        else if (/^\d/.test(items[0].txt)) { out.push("<ol>" + items.map(it => `<li>${inline(it.txt)}</li>`).join("") + "</ol>"); }
        else { out.push("<ul>" + items.map(it => `<li>${inline(it.txt)}</li>`).join("") + "</ul>"); }
        continue;
      }
      if (t === "") { flushP(); flushT(); i++; continue; }
      pbuf.push(line); i++;
    }
    flushP(); flushT();
    return out.join("\n");
  }
  return { parse, parseInline };
})();

/* ---------- 通用工具 ---------- */
const $ = id => document.getElementById(id);
const statusLabel = s => ({ outlining:"大纲中", drafting:"写作中", paused:"已暂停", completed:"已完成", active:"进行中" }[s] || s || "—");
const escHtml = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtNum = n => (n || 0).toLocaleString("zh-CN");
function countText(s){ if(!s) return 0; return (s.match(/[一-鿿]/g)||[]).length + (s.match(/[A-Za-z0-9]+/g)||[]).length; }

/* ---------- 运行时数据（由读文件夹填充） ---------- */
let data = null;

/* ---------- 读取书源文件夹（handle 模式 / entries 模式） ---------- */
async function readTextFromHandle(handle, path) {
  const parts = path.split("/");
  let dir = handle;
  try {
    for (let i = 0; i < parts.length - 1; i++) {
      if (!parts[i]) continue;
      dir = await dir.getDirectoryHandle(parts[i]);
    }
    const fh = await dir.getFileHandle(parts[parts.length - 1]);
    return await (await fh.getFile()).text();
  } catch { return null; }
}
async function readTextFromEntries(entries, relPath) {
  const f = entries.find(e => e.fullPath.endsWith("/" + relPath) || e.fullPath === relPath);
  return f ? await f.text() : null;
}

async function collectRoles(handle, entries) {
  const roles = [];
  if (handle) {
    const ROLE_RE = /roles\/(?:major|minor|主要角色|次要角色)\/(.+?\.(?:md|MD))$/;
    async function walk(dir, prefix) {
      for await (const [name, h] of dir.entries()) {
        const path = prefix + "/" + name;
        if (h.kind === "file" && name.endsWith(".md")) {
          const m = path.match(ROLE_RE);
          if (m) {
            const tier = /次要|minor/.test(path) ? "次要角色" : "主要角色";
            let text = "";
            try { text = await (await h.getFile()).text(); } catch {}
            roles.push({ tier, name: m[1].replace(/\.md$/i, ""), text });
          }
        } else if (h.kind === "directory") {
          try { await walk(h, path); } catch {}
        }
      }
    }
    try { await walk(handle, ""); } catch {}
  } else if (entries) {
    for (const e of entries) {
      const m = e.fullPath.match(/roles\/(?:major|minor|主要角色|次要角色)\/(.+?\.(?:md|MD))$/);
      if (m) {
        const tier = /次要|minor/.test(e.fullPath) ? "次要角色" : "主要角色";
        roles.push({ tier, name: m[1].replace(/\.md$/i,""), text: await e.text() });
      }
    }
  }
  const seen = new Set();
  return roles.filter(r => { const k = r.tier + "|" + r.name; if (seen.has(k)) return false; seen.add(k); return true; });
}

async function collectChapters(handle, entries) {
  const out = [];
  let dh, files = [];
  try { dh = await handle.getDirectoryHandle("chapters"); } catch { dh = null; }
  if (dh) { for await (const [n, h] of dh.entries()) { if (n.endsWith(".md") && h.kind === "file") files.push({ n, t: await (await h.getFile()).text() }); } }
  else if (entries) {
    files = entries.filter(e => /chapters\/.+\.(md|MD)$/.test(e.fullPath)).map(e => ({ n: e.fullPath.split("/").pop(), _t: e.text() }));
  }
  for (const f of files.sort((a,b) => a.n.localeCompare(b.n, "zh"))) {
    const text = f.t || await f._t;
    const num = parseInt(f.n) || 0;
    const title = f.n.replace(/^\d+[_\-]?/, "").replace(/\.md$/i, "").trim();
    out.push({ name: f.n, num, title, text });
  }
  return out;
}

async function listTopLevel(handle, entries) {
  try {
    if (handle) {
      const names = [];
      for await (const [name] of handle.entries()) names.push(name);
      return names.slice(0, 20).join("、");
    } else if (entries) {
      const seen = new Set();
      for (const e of entries) { const top = e.fullPath.split("/")[0]; if (!seen.has(top)) seen.add(top); }
      return [...seen].slice(0, 20).join("、");
    }
  } catch {}
  return "（无法读取）";
}

async function validateBookDir(handle, entries) {
  const missing = [];
  let bookJson = null;
  try {
    bookJson = handle ? await readTextFromHandle(handle, "book.json") : await readTextFromEntries(entries, "book.json");
  } catch {}
  if (bookJson == null) missing.push("book.json");
  let hasChapters = false;
  try {
    if (handle) { const dh = await handle.getDirectoryHandle("chapters"); hasChapters = !!dh; }
    else if (entries) { hasChapters = entries.some(e => /chapters\/.+\.(md|MD)$/.test(e.fullPath)); }
  } catch { hasChapters = false; }
  if (!hasChapters) missing.push("chapters/");
  return missing;
}

async function loadBook(handle, entries) {
  try {
    const missing = await validateBookDir(handle, entries);
    if (missing.length) {
      const got = await listTopLevel(handle, entries);
      throw new Error(
        "在所选目录中未找到：" + missing.join("、") + "。\n" +
        "该目录内容为：" + got + "\n\n" +
        "请选择书的根目录（即含 book.json、chapters/、story/ 的那一层）。"
      );
    }
    const read = (p) => handle ? readTextFromHandle(handle, p) : readTextFromEntries(entries, p);
    const [bjs, sf, vm, br, cs, summ, style, drift] = await Promise.all([
      read("book.json"), read("story/outline/story_frame.md"), read("story/outline/volume_map.md"),
      read("story/book_rules.md"), read("story/current_state.md"), read("story/chapter_summaries.md"),
      read("story/style_guide.md"), read("story/audit-drift.md")
    ]);
    data = {
      book: bjs ? JSON.parse(bjs.replace(/^﻿/, "")) : {},
      chapters: await collectChapters(handle, entries),
      roles: await collectRoles(handle, entries),
      files: { story_frame: sf, volume_map: vm, book_rules: br, current_state: cs, chapter_summaries: summ, style_guide: style, audit_drift: drift }
    };
    document.body.classList.add("loaded");
    try { if (handle) await idbSave("last", handle); } catch {}
    await render();
  } catch (err) {
    console.error(err);
    if (autoResumed) return;
    const friendly =
      err && err.message && !err.message.includes("could not be found") && !err.message.includes("be found at the time")
        ? err.message
        : "未能读取书源文件。";
    alert(
      "【加载失败】" + friendly + "\n\n" +
      "请点「选择书架文件夹」，选择该书的根目录（含 book.json、chapters/、story/ 的那一层）。\n" +
      "如果选的是 books/ 或项目根目录，请再往下一层，选到具体的某一本书。"
    );
  }
}

/* ---------- IndexedDB：记住上次选中的文件夹句柄 ---------- */
const IDB = (() => {
  let db = null;
  function open() { return new Promise((res, rej) => {
    try { const r = indexedDB.open("dragon-writer-dashboard", 1); r.onupgradeneeded = e => e.target.result.createObjectStore("handles"); r.onsuccess = e => { db = e.target.result; res(db); }; r.onerror = () => rej(); }
    catch (e) { rej(e); } });
  }
  async function save(name, handle) {
    if (!db) await open(); return new Promise((res, rej) => {
      try { const t = db.transaction("handles", "readwrite"); t.objectStore("handles").put(handle, name); t.oncomplete = () => res(); t.onerror = () => rej(); }
      catch (e) { rej(e); } });
  }
  function load(name) { return new Promise((res, rej) => {
    if (!db) return open().then(() => load(name)).then(res).catch(rej);
    try { const t = db.transaction("handles", "readonly"); const q = t.objectStore("handles").get(name); q.onsuccess = () => res(q.result); q.onerror = () => rej(); }
    catch (e) { rej(e); } });
  }
  return { save, load };
})();
const idbSave = IDB.save;

/* ---------- 按嵌入数据计算的各文件解析函数 ---------- */
function sectionLines(text, re){
  if (!text) return [];
  const m = text.match(new RegExp(`##?\\s*[^\\n]*(?:${re})[\\s\\S]*?(?=\\n##?\\s|$)`, "i"));
  if (!m) return [];
  return m[0].replace(/^#+\s*.*\n/, "").trim().split("\n").map(l => l.replace(/^[-*]\s*/, "").trim()).filter(Boolean);
}
function sectionOf(text, re){ return sectionLines(text, re).slice(0, 6).join("；"); }

function roleField(text, labels){
  if (!text) return "";
  const labelList = (Array.isArray(labels) ? labels : [labels]).map(s => String(s).toLowerCase());
  for (const raw of text.split("\n")) {
    const m = raw.match(/^\s*[-*]\s*\*\*\s*([^*]+?)\s*\*\*\s*[：:]\s*(.*)$/);
    if (!m) continue;
    const tag = m[1].trim().toLowerCase();
    if (labelList.some(l => tag === l || tag.includes(l) || l.includes(tag))) return m[2].trim();
  }
  return "";
}

function calcSettingsCompletion(files){
  const domains = [
    { key:"story_frame", title:"故事框架 (story_frame.md)", subs:["主题[与和]基调","前[台景]故事|背景故事","核心冲突|对手","世界[法]?[则律]|[世]?[界定]?[法文]?","终局[目][标]|[最]终[目][标点]"] },
    { key:"volume_map", title:"卷纲 (volume_map.md)", subs:["弧线[结构]?|[故]?事弧线","情感曲线","钩子[种伏][子]?|回报图|伏笔","人[物][角色]?弧线|角色成长","节奏[原]?[则][理]?|节奏"] },
    { key:"book_rules", title:"规则书 (book_rules.md)", subs:["POV|[视][角]|[叙][事][视][角]","题材[规]?[则][定]?","定局锁|[必][要][条][件]|硬锁|canon","力[量量]?|[资][源]?|[时][间]?[极][制]?|限制","禁[手止]|[禁][止][动]?[作]?","风[格][约约]?[束素]?|风格[原]?[则][限]"] },
    { key:"current_state", title:"当前状态 (current_state.md)", subs:["[当]?[前]?章节|进度","地点|时间","主角|主人[公候]?|protagonist","已知真[相]?|线索","关系|人际","资源|伤势|库存|物品","冲[突突]|危[机害]?|当前[涉事]?[件情]?"] }
  ];
  const out = [];
  for (const d of domains) {
    if (!files[d.key]) { out.push({ key:d.key, title:d.title, present:false, pct:0, items:[] }); continue; }
    const t = files[d.key];
    const items = d.subs.map(re => {
      const sec = t.match(new RegExp("##?\\s*[^\\n]*" + re + "[\\s\\S]*?(?=\\n##?\\s|$)", "i"));
      let filled = false;
      if (sec) { const body = sec[0].replace(/^.*\n/, "").trim(); filled = body.length > 0 && !/^[-\s]*$/.test(body) && !/待[编写定充实]|TODO|xx|请输入/i.test(body); }
      return { label: re.replace(/[\[\]?|]/g,(c)=>({"[":"","]":"","?":"","|":" / "}[c])), ok: filled };
    });
    out.push({ key:d.key, title:d.title, present:true, pct: Math.round(items.filter(i=>i.ok).length / items.length * 100), items });
  }
  return out;
}
function renderAuditDrift(text){
  if (!text || !text.trim()) return `<div class="empty-state">暂无审计漂移记录</div>`;
  const html = (title, body) => {
    const items = body.split(/\n###\s+/).filter(Boolean);
    if (!items.length) return "";
    return `<div style="margin-bottom:16px;"><div style="font-weight:600;margin-bottom:6px;color:var(--accent)">${escHtml(title)}</div>` +
      items.map(it => {
        const li = it.split("\n").filter(l => l.trim());
        const head = li.shift() || "";
        return `<div style="margin-bottom:10px;padding-left:8px;border-left:2px solid var(--border)"><b>${escHtml(head.trim().replace(/^第\d+章 · /,""))}</b>` +
          li.map(l => `<div class="muted" style="font-size:13px;margin-top:2px">${escHtml(l.replace(/^-\s*/,"").trim())}</div>`).join("") +
          `</div>`;
      }).join("") + `</div>`;
  };
  const fixed = text.match(/## 已修复([\s\S]*?)(?=\n## |$)/);
  const open = text.match(/## 已知漂移([\s\S]*?)(?=\n## |$)/);
  let out = "";
  if (fixed && fixed[1].trim()) out += html("已修复", fixed[1]);
  if (open && open[1].trim()) out += html("已知漂移", open[1]);
  return out || `<div class="md">${MD.parse(text)}</div>`;
}
function parseRecentSummaries(text, n=6){
  if (!text) return [];
  const rows = text.split("\n").filter(l => /^\|\s*[：:]?\d/.test(l.trim()));
  return rows.slice(-n).map(r => { const c = r.replace(/^\||\|$/g,"").split("|").map(x=>x.trim()); return { ch:c[0], title:c[1], chars:c[2], events:c[3], change:c[4], hook:c[5], mood:c[6] }; }).filter(r => r.title);
}
function parseCurrentState(text){
  if (!text) return "";
  const section = h => { const m = text.match(new RegExp(`##?\\s*${h}[\\s\\S]*?(?=\\n##?\\s|$)`,"i")); return m ? m[0].replace(/^#+\s*.*\n/,"").trim() : ""; };
  const pick = (h,label) => { const s = section(h); if(!s) return null; return `<b>${escHtml(label)}</b>：${escHtml(s.split("\n").filter(l=>l.trim()).slice(0,6).join("；"))}`; };
  const items = ["地点?与?时间","主角","已知真相","关系","资源","当前冲突"].map((k,i) => pick(k,["地点/时间","主角","已知真相","关系/资源","资源/当前冲突","当前冲突"][i])).filter(Boolean);
  return items.length ? items.join("<br>") : `<span class="muted">暂无状态记录</span>`;
}
function buildGraph(roles){
  const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#b5651d";
  const minorColor = getComputedStyle(document.documentElement).getPropertyValue("--text-muted").trim() || "#6b6760";
  const nodes = roles.map((r,i) => ({ i, name:r.name, tier:r.tier, color: /次要|minor/.test(r.tier) ? minorColor : accent,
    func: sectionOf(r.text,"Story [Ff]unction|故事功能|角色[定定]?[位义]|功能"),
    desire: roleField(r.text, ["欲望", "desire"]) || sectionOf(r.text,"[Dd]esire|欲望"),
    fear: roleField(r.text, ["恐惧", "fear"]) || sectionOf(r.text,"[Ff]ear|恐惧"),
    state: roleField(r.text, ["当前状态", "current state"]) || sectionOf(r.text,"[Cc]urrent [Ss]tate|当前状态"),
    arc: roleField(r.text, ["弧线", "成长", "arc"]) || sectionOf(r.text,"[Aa]rc|弧线|成长"),
    secrets: sectionOf(r.text,"[Ss]ecrets|秘密") }));
  const nameIdx = new Map(nodes.map(nd => [nd.name.toLowerCase(), nd.i]));
  const edges = [];
  roles.forEach(r => {
    const lines = sectionLines(r.text, "[Rr]elationships?|关系[网战]?");
    const si = nodes.findIndex(nd => nd.name === r.name);
    for (const l of lines) {
      const m = l.match(/^([^:：\-\(（]{1,20})\s*[—\-:：]\s*(.+)$/);
      if (m) { const ti = nameIdx.get(m[1].trim().toLowerCase()); if (ti !== undefined && ti !== si) edges.push({ s:si, t:ti, label:m[2].trim() }); }
    }
  });
  return { nodes, edges };
}

/* ---------- 力导向关系图 ---------- */
const Graph = (() => {
  let canvas, ctx, nodes=[], edges=[], W=0, H=0, selected=-1, dragging=-1, raf=null;
  const tierColor = n => /次要|minor/.test(n.tier) ? "#6b6760" : getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#b5651d";
  function init(gdata){
    canvas = $("graph"); ctx = canvas.getContext("2d");
    const resize = () => { const r = canvas.getBoundingClientRect(); const dpr = window.devicePixelRatio||1;
      canvas.width = r.width*dpr; canvas.height = r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); W=r.width; H=r.height; };
    resize(); window.addEventListener("resize", resize);
    if (typeof ResizeObserver !== "undefined") {
      let lastW = 0, lastH = 0;
      const ro = new ResizeObserver(() => {
        const r = canvas.getBoundingClientRect();
        if (r.width > 0 && r.height > 0 && (Math.abs(r.width - lastW) > 0.5 || Math.abs(r.height - lastH) > 0.5)) {
          lastW = r.width; lastH = r.height; resize();
          if (nodes.length) for (const n of nodes) { n.x = Math.max(40, Math.min(W - 40, n.x)); n.y = Math.max(40, Math.min(H - 40, n.y)); }
        }
      });
      ro.observe(canvas);
    }
    nodes = gdata.nodes.map((n,i) => ({ ...n, x:W/2+(Math.random()-0.5)*200, y:H/2+(Math.random()-0.5)*200, vx:0, vy:0 }));
    edges = gdata.edges;
    canvas.onpointerdown = e => { const h = nodeAt(e); dragging = h; if (h>=0) selectNode(h); };
    canvas.onpointermove = e => { if (dragging>=0){ const r=canvas.getBoundingClientRect(); nodes[dragging].x=e.clientX-r.left; nodes[dragging].y=e.clientY-r.top; nodes[dragging].vx=nodes[dragging].vy=0; } canvas.style.cursor = nodeAt(e)>=0 ? "pointer" : "grab"; };
    canvas.onpointerup = () => { dragging = -1; };
    loop();
  }
  function nodeAt(e){ const r=canvas.getBoundingClientRect(); const mx=e.clientX-r.left,my=e.clientY-r.top; for(let i=nodes.length-1;i>=0;i--){const n=nodes[i];if((mx-n.x)**2+(my-n.y)**2 < radius(n)**2) return i;} return -1; }
  function radius(n){ return 18 + Math.min(14, degree(n.i)*2); }
  function degree(i){ return edges.filter(e=>e.s===i||e.t===i).length; }
  function loop(){
    for (const n of nodes){ n.vx*=0.85; n.vy*=0.85; }
    for (const e of edges){ const a=nodes[e.s],b=nodes[e.t]; const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1; const f=(d-170)*0.008,ux=dx/d,uy=dy/d; a.vx+=ux*f;a.vy+=uy*f;b.vx-=ux*f;b.vy-=uy*f; }
    for (let i=0;i<nodes.length;i++){ for(let j=i+1;j<nodes.length;j++){ const a=nodes[i],b=nodes[j]; let dx=b.x-a.x,dy=b.y-a.y; const d=Math.sqrt(dx*dx+dy*dy)||1,f=-1400/(d*d),ux=dx/d,uy=dy/d; a.vx+=ux*f;a.vy+=uy*f;b.vx-=ux*f;b.vy-=uy*f; } }
    for (const n of nodes){ n.vx+=(W/2-n.x)*0.0012; n.vy+=(H/2-n.y)*0.0012; if(nodes.indexOf(n)!==dragging){ n.x+=n.vx;n.y+=n.vy; n.x=Math.max(30,Math.min(W-30,n.x)); n.y=Math.max(30,Math.min(H-30,n.y)); } }
    draw(); raf=requestAnimationFrame(loop);
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    if(!nodes.length){ ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--text-muted").trim(); ctx.font="14px var(--sans)"; ctx.textAlign="center"; ctx.fillText("暂无角色数据",W/2,H/2); return; }
    const lineColor = getComputedStyle(document.documentElement).getPropertyValue("--border").trim();
    const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
    const labelColor = getComputedStyle(document.documentElement).getPropertyValue("--text-muted").trim();
    const bgSoft = getComputedStyle(document.documentElement).getPropertyValue("--bg-subtle").trim();
    for(const e of edges){
      const a=nodes[e.s],b=nodes[e.t];
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
      ctx.strokeStyle=lineColor; ctx.globalAlpha=0.55; ctx.lineWidth=1.8; ctx.stroke(); ctx.globalAlpha=1;
      if(e.label){
        const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
        const txt=e.label;
        ctx.font="11px var(--sans)";
        const tw=ctx.measureText(txt).width;
        ctx.fillStyle=bgSoft; ctx.fillRect(mx-tw/2-4,my-7,tw+8,14);
        ctx.fillStyle=labelColor; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(txt,mx,my);
      }
    }
    for(const n of nodes){
      const r=radius(n); ctx.beginPath(); ctx.arc(n.x,n.y,r,0,Math.PI*2); ctx.fillStyle=n.color; ctx.fill();
      if(nodes.indexOf(n)===selected){ ctx.lineWidth=3; ctx.strokeStyle=accent; ctx.stroke(); }
      ctx.fillStyle="#fff"; ctx.font=`${Math.round(r*0.7)}px var(--sans)`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(n.name.slice(0,3),n.x,n.y);
      ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--text").trim(); ctx.font="12px var(--sans)"; ctx.textBaseline="alphabetic"; ctx.fillText(n.name,n.x,n.y+r+12);
    }
  }
  function setSelect(i){
    selected=i; draw();
    const info=$("graphInfo");
    if(i<0){ info.innerHTML='<div class="empty-state">点击图中节点或右侧角色卡片，查看该角色的故事功能、欲望 / 恐惧、当前状态与关系。</div>'; return; }
    const n=nodes[i];
    const fields=[["故事功能",n.func],["欲望",n.desire],["恐惧",n.fear],["当前状态",n.state],["弧线",n.arc],["秘密",n.secrets]].filter((a)=>a[1]);
    const rels=edges.filter(e=>e.s===i||e.t===i).map(e=>{ const o=nodes[e.s===i?e.t:e.s]; return `<div style="margin-bottom:6px"><span class="rname">${escHtml(o.name)}</span>${e.label?' — '+MD.parseInline(e.label):''}</div>`; });
    info.innerHTML=`<div class="name">${escHtml(n.name)}</div><div class="tier">${escHtml(n.tier)}</div>` +
      (fields.length?`<dl>${fields.map(([k,v])=>`<dt>${escHtml(k)}</dt><dd>${MD.parseInline(v)}</dd>`).join("")}</dl>`:'') +
      (rels.length?`<div class="rels" style="font-size:13px;color:var(--text-muted)">${rels.join("")}</div>`:'');
  }
  return { init, setSelect };
})();
function drawGraph(g){ Graph.init(g); }
let prevCard=null;
function selectNode(i){
  Graph.setSelect(i);
  if(prevCard) prevCard.style.borderColor="";
  const el=document.querySelector(`.charcard[data-i="${i}"]`);
  if(el){ el.style.borderColor="var(--accent)"; prevCard=el; }
}

/* ---------- 阅读 ---------- */
let currentChapter=-1;
function drawToc(chapters){
  $("toc").innerHTML = `<div class="toc-title">目录 · ${chapters.length} 章</div>` + chapters.map((c,i) => `<button data-i="${i}"><span class="ch-no">第 ${c.num||(i+1)} 回</span>${escHtml(c.title||c.name)}</button>`).join("");
  $("toc").onclick = e => { const b=e.target.closest("button"); if(b) openChapter(+b.dataset.i); };
}
function openChapter(i){
  const ch=data.chapters[i]; if(!ch) return; currentChapter=i;
  document.querySelectorAll("#toc button").forEach((b,k)=>b.classList.toggle("active",k===i));
  $("article").innerHTML = `<h1>${escHtml(ch.title||("第 "+(ch.num||(i+1))+" 回"))}</h1>
    <div class="muted" style="margin-bottom:20px;font-family:var(--sans);font-size:13px;">共 ${fmtNum(countText(ch.text))} 字</div>
    ${MD.parse(ch.text)}`;
  $("prevBtn").disabled = i<=0; $("nextBtn").disabled = i>=data.chapters.length-1;
  $("article").scrollTop = 0;
  if (location.hash !== "#read") switchTab("read");
}
$("prevBtn").onclick = () => { if(currentChapter>0) openChapter(currentChapter-1); };
$("nextBtn").onclick = () => { if(currentChapter<data.chapters.length-1) openChapter(currentChapter+1); };

/* ---------- Tab + 主题 ---------- */
function switchTab(name){
  document.querySelectorAll(".tabs button").forEach(b => {
    const isActive = b.dataset.tab === name;
    b.classList.toggle("active", isActive);
    b.setAttribute("aria-selected", isActive);
  });
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id==="panel-"+name));
  location.hash = name;
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => switchTab(b.dataset.tab));
function applyTheme(mode){
  const root=document.documentElement; root.classList.remove("theme-auto","theme-dark");
  if(mode==="dark") root.classList.add("theme-dark"); else if(mode==="auto") root.classList.add("theme-auto");
  $("themeBtn").textContent = mode==="dark" ? "☀" : "🌙";
  try{ localStorage.setItem("dw-theme", mode); }catch{}
}
$("themeBtn").onclick = () => { const cur=(localStorage.getItem("dw-theme")||"auto"); applyTheme(cur==="dark"?"auto":"dark"); };
applyTheme((localStorage.getItem("dw-theme")||"auto"));

/* ---------- 入口绑定 ---------- */
let lastHandle = null;
let autoResumed = false;
async function pickFolder() {
  if (window.showDirectoryPicker) {
    try {
      const handle = await window.showDirectoryPicker({ mode: "read", id: "dragon-writer-book" });
      $("resumeName").textContent = handle.name;
      autoResumed = false;
      await loadBook(handle, null);
    } catch (e) { if (e && e.name === "AbortError") return; }
  } else { $("fileInput").click(); }
}
$("pickBtn").onclick = pickFolder;
$("compatBtn").onclick = () => $("fileInput").click();
$("refreshBtn").onclick = () => { if (lastHandle) { autoResumed = false; loadBook(lastHandle, null); } else pickFolder(); };
$("rePickBtn").onclick = () => { document.body.classList.remove("loaded"); data = null; pickFolder(); };
$("fileInput").onchange = (e) => { if (e.target.files.length) { autoResumed = false; loadBook(null, Array.from(e.target.files)); } };
const _origLoad = loadBook;
loadBook = async (handle, entries) => { lastHandle = handle; $("refreshBtn").style.display = "inline-block"; await _origLoad(handle, entries); };
async function tryResumeSilent(h) {
  try {
    let perm = await h.queryPermission({ mode: "read" });
    if (perm !== "granted") perm = await h.requestPermission({ mode: "read" });
    if (perm !== "granted") return false;
    autoResumed = true;
    await loadBook(h, null);
    return true;
  } catch (err) { console.warn("自动恢复书架失败", err); return false; }
}

/* ---------- 导出全本 TXT ---------- */
$("exportBtn").onclick = () => {
  if (!data || !data.chapters.length) { alert("暂无章节可导出"); return; }
  const lines = [];
  lines.push(data.book.title || "未命名");
  lines.push("=".repeat(40));
  lines.push(`共 ${data.chapters.length} 章 / 约 ${fmtNum(data.chapters.reduce((s,c) => s + countText(c.text), 0))} 字`);
  lines.push("");
  data.chapters.forEach((c, i) => {
    lines.push(`\n第 ${c.num || (i + 1)} 回${c.title ? " · " + c.title : ""}`);
    lines.push("-".repeat(30));
    lines.push(c.text.trim());
  });
  const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${data.book.title || "book"}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

/* ---------- 启动：自动静默重连上次书架，失败则停留落地页；用户也可手动选 ---------- */
(async () => {
  if (!window.showDirectoryPicker) return;
  try {
    const h = await IDB.load("last");
    if (!h) return;
    $("resumeArea").style.display = "block";
    $("resumeName").textContent = h.name;
    $("resumeLink").onclick = (e) => { e.preventDefault(); tryResumeSilent(h); };
    await tryResumeSilent(h);
  } catch (e) { /* 首次访问 / 无句柄：停留落地页 */ }
})();
</script>
